<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · Shaona</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600;700&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08060a;
  --bg-2:#15000d;
  --pink:#ff0066;
  --cyan:#00e0ff;
  --text:#fff;
  --muted:#888;
  --border:rgba(255,255,255,.08);
  --row-hover:rgba(255,0,102,.05);
}
html,body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit}

.topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 32px;border-bottom:1px solid var(--border);background:rgba(8,6,10,.94);backdrop-filter:blur(14px);position:sticky;top:0;z-index:30}
.logo{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:600;letter-spacing:1px}
.logo em{color:var(--pink);font-style:normal}
.logo .tag{margin-left:14px;font-family:'Outfit',sans-serif;font-size:.66rem;letter-spacing:3px;color:var(--cyan);text-transform:uppercase;border:1px solid var(--cyan);padding:3px 10px;border-radius:99px;vertical-align:middle}
.top-actions{display:flex;gap:10px;align-items:center}
.user-chip{font-size:.78rem;color:var(--muted)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);padding:8px 16px;font-size:.74rem;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:all .2s}
.btn-ghost:hover{border-color:var(--pink);color:var(--pink)}

/* Login */
.login-wrap{display:flex;justify-content:center;align-items:center;min-height:calc(100vh - 70px);padding:24px}
.login-card{width:100%;max-width:400px;background:linear-gradient(160deg,var(--bg-2),rgba(0,0,0,.6));border:1px solid var(--border);padding:40px 32px}
.login-card h1{font-family:'Cormorant Garamond',serif;font-size:1.9rem;margin-bottom:6px}
.login-card .sub{color:var(--muted);font-size:.86rem;margin-bottom:26px}
.input-row{margin-bottom:16px}
.input-row label{display:block;font-size:.7rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.input-row input{width:100%;background:rgba(0,0,0,.4);border:1px solid var(--border);color:var(--text);padding:13px 14px;font-size:.92rem;font-family:inherit;border-radius:0;transition:border-color .2s}
.input-row input:focus{outline:none;border-color:var(--pink)}
.btn-primary{display:block;width:100%;background:var(--pink);color:#fff;border:none;padding:14px;font-size:.78rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .2s;margin-top:6px}
.btn-primary:hover{background:#cc0044}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.error-msg{color:#ff5577;font-size:.82rem;margin-top:12px;min-height:1.2em}

/* Main */
.main{padding:24px 32px 80px}
.tabs{display:flex;gap:4px;margin-bottom:24px;border-bottom:1px solid var(--border)}
.tab{background:transparent;border:none;color:var(--muted);font-size:.78rem;letter-spacing:2px;text-transform:uppercase;font-weight:600;padding:14px 22px;cursor:pointer;transition:all .2s;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--pink);border-bottom-color:var(--pink)}
.tab:hover:not(.active){color:var(--text)}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.toolbar select,.toolbar input{background:rgba(0,0,0,.4);border:1px solid var(--border);color:var(--text);padding:10px 12px;font-size:.85rem;font-family:inherit;border-radius:0;transition:border-color .2s}
.toolbar select:focus,.toolbar input:focus{outline:none;border-color:var(--pink)}
.toolbar .grow{flex:1}
.toolbar .stat{font-size:.78rem;color:var(--muted);letter-spacing:1px}
.toolbar .stat strong{color:var(--text);font-weight:600;margin-right:4px}

/* Stats cards */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:22px}
.stat-card{background:linear-gradient(160deg,var(--bg-2),rgba(0,0,0,.5));border:1px solid var(--border);padding:18px 20px}
.stat-card .label{font-size:.7rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.stat-card .value{font-family:'Cormorant Garamond',serif;font-size:2.2rem;font-weight:600;line-height:1;color:var(--text)}
.stat-card .value.pink{color:var(--pink)}
.stat-card .value.cyan{color:var(--cyan)}

/* Table */
.table-wrap{background:linear-gradient(160deg,var(--bg-2),rgba(0,0,0,.4));border:1px solid var(--border);overflow:hidden}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl thead{background:rgba(0,0,0,.4)}
.tbl th{text-align:left;padding:14px 16px;font-size:.7rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:14px 16px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--text)}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{cursor:pointer;transition:background .15s}
.tbl tbody tr:hover{background:var(--row-hover)}
.tbl tbody tr.expanded{background:rgba(255,0,102,.04)}
.tbl .muted{color:var(--muted)}
.tbl .num{font-variant-numeric:tabular-nums;color:var(--cyan);font-weight:600}
.tbl .pill{display:inline-block;font-size:.65rem;letter-spacing:1.5px;text-transform:uppercase;padding:3px 10px;border-radius:99px;font-weight:600}
.pill-reservado{background:rgba(255,0,102,.18);color:var(--pink)}
.pill-evento{background:rgba(0,224,255,.18);color:var(--cyan)}
.pill-cumpleanos{background:rgba(255,200,40,.18);color:#ffc828}
.pill-mesa{background:rgba(160,160,160,.15);color:#bbb}

.expand-row td{background:rgba(0,0,0,.3);padding:18px 22px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.kv-item{font-size:.85rem}
.kv-item .k{display:block;font-size:.66rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.kv-item .v{color:var(--text);word-break:break-word}

.empty{padding:50px 20px;text-align:center;color:var(--muted);font-size:.92rem}
.loading{padding:50px 20px;text-align:center;color:var(--muted);font-size:.85rem;letter-spacing:1.5px}

.action-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.action-row button{background:transparent;border:1px solid var(--border);color:var(--text);padding:9px 18px;font-size:.74rem;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;font-family:inherit;transition:all .2s}
.action-row button:hover{border-color:var(--cyan);color:var(--cyan)}
.action-row button.danger:hover{border-color:#ff3366;color:#ff5577}

.no-config{max-width:560px;margin:80px auto;padding:0 24px;text-align:center}
.no-config h2{font-family:'Cormorant Garamond',serif;font-size:2rem;color:var(--pink);margin-bottom:14px}
.no-config p{color:var(--muted);font-size:.95rem;line-height:1.6;margin-bottom:14px}
.no-config code{background:rgba(255,0,102,.1);color:var(--pink);padding:2px 8px;font-family:monospace;font-size:.85rem}

@media (max-width:760px){
  .topbar{padding:14px 18px}
  .main{padding:20px 16px 60px}
  .tabs{overflow-x:auto;white-space:nowrap}
  .tbl{font-size:.8rem}
  .tbl th,.tbl td{padding:10px 12px}
  .hide-sm{display:none}
}
</style>
</head>
<body>

<header class="topbar">
  <a href="index.html" class="logo">Shaona<em>.</em><span class="tag">Admin</span></a>
  <div class="top-actions" id="topActions"></div>
</header>

<main id="main"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script src="shaona-config.js"></script>
<script>
/* ============================================================
   ADMIN PANEL — Shaona
   ============================================================ */
const CFG = window.SHAONA_CONFIG || {};
const main = document.getElementById('main');
const topActions = document.getElementById('topActions');

let supa = null;
if (window.supabase && CFG.supabaseUrl && CFG.supabaseAnonKey){
  supa = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {
    auth: { persistSession: true, autoRefreshToken: true }
  });
}

let session = null;
let currentTab = 'reservas';
let reservations = [];
let scores = [];
let availableEvents = [];
let currentEventId = null;
let filterType = 'all';
let filterText = '';
let filterFrom = '';
let filterTo = '';

/* === Boot === */
async function boot(){
  if (!supa){
    renderNoConfig();
    return;
  }
  const { data } = await supa.auth.getSession();
  session = data.session;
  if (!session){
    renderLogin();
  } else {
    renderAdmin();
  }
  supa.auth.onAuthStateChange((_evt, sess) => {
    session = sess;
    if (!session) renderLogin();
  });
}

function renderNoConfig(){
  main.innerHTML = `
    <div class="no-config">
      <h2>Falta configurar Supabase</h2>
      <p>Edita <code>shaona-config.js</code> y rellena <code>supabaseUrl</code> y <code>supabaseAnonKey</code>.</p>
      <p>Los encuentras en tu proyecto de Supabase → Project Settings → API.</p>
    </div>`;
}

/* === Login === */
function renderLogin(){
  topActions.innerHTML = '';
  main.innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <h1>Panel <em style="color:var(--pink);font-style:italic">Shaona</em></h1>
        <p class="sub">Acceso restringido. Inicia sesión con tu cuenta de administrador.</p>
        <form id="loginForm">
          <div class="input-row">
            <label>Email</label>
            <input type="email" id="loginEmail" required autocomplete="email">
          </div>
          <div class="input-row">
            <label>Contraseña</label>
            <input type="password" id="loginPass" required autocomplete="current-password">
          </div>
          <button class="btn-primary" type="submit" id="loginBtn">Entrar</button>
          <p class="error-msg" id="loginError"></p>
        </form>
      </div>
    </div>`;
  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPass').value;
    const err = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Entrando…';
    const { data, error } = await supa.auth.signInWithPassword({ email, password });
    if (error){
      err.textContent = error.message || 'No se pudo iniciar sesión.';
      btn.disabled = false;
      btn.textContent = 'Entrar';
      return;
    }
    session = data.session;
    renderAdmin();
  });
}

/* === Admin === */
async function renderAdmin(){
  topActions.innerHTML = `
    <span class="user-chip">${escapeHtml(session?.user?.email || '')}</span>
    <button class="btn-ghost" id="logoutBtn">Cerrar sesión</button>
  `;
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await supa.auth.signOut();
    session = null;
    renderLogin();
  });

  main.innerHTML = `
    <div class="main">
      <div class="tabs">
        <button class="tab ${currentTab==='reservas'?'active':''}" data-tab="reservas">Reservas</button>
        <button class="tab ${currentTab==='torneo'?'active':''}" data-tab="torneo">Torneo</button>
      </div>
      <div id="tabContent"></div>
    </div>`;
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => { currentTab = t.dataset.tab; renderAdmin(); });
  });
  if (currentTab === 'reservas') await renderReservas();
  else await renderTorneo();
}

/* === RESERVAS === */
async function renderReservas(){
  const content = document.getElementById('tabContent');
  content.innerHTML = `
    <div class="toolbar">
      <select id="fType">
        <option value="all">Todos los tipos</option>
        <option value="reservado">Reservados</option>
        <option value="evento">Eventos</option>
        <option value="cumpleanos">Cumpleaños</option>
        <option value="mesa">Mesas</option>
      </select>
      <input type="date" id="fFrom" title="Desde">
      <input type="date" id="fTo" title="Hasta">
      <input type="search" id="fText" placeholder="Buscar nombre, teléfono…" class="grow">
      <button class="btn-ghost" id="refreshRes">↻ Recargar</button>
      <button class="btn-ghost" id="exportRes">Exportar CSV</button>
    </div>
    <div id="resStats"></div>
    <div class="table-wrap">
      <div class="loading">Cargando reservas…</div>
    </div>`;

  document.getElementById('fType').value = filterType;
  document.getElementById('fFrom').value = filterFrom;
  document.getElementById('fTo').value = filterTo;
  document.getElementById('fText').value = filterText;

  ['fType','fFrom','fTo','fText'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
      filterType = document.getElementById('fType').value;
      filterFrom = document.getElementById('fFrom').value;
      filterTo = document.getElementById('fTo').value;
      filterText = document.getElementById('fText').value;
      paintReservasTable();
    });
  });
  document.getElementById('refreshRes').addEventListener('click', loadReservas);
  document.getElementById('exportRes').addEventListener('click', exportReservasCSV);

  await loadReservas();
}

async function loadReservas(){
  const { data, error } = await supa.from('reservations')
    .select('*')
    .order('created_at', { ascending: false })
    .limit(2000);
  if (error){
    document.querySelector('.table-wrap').innerHTML = `<div class="empty">Error: ${escapeHtml(error.message)}</div>`;
    return;
  }
  reservations = data || [];
  paintReservasTable();
}

function filteredReservas(){
  return reservations.filter(r => {
    if (filterType !== 'all' && r.type !== filterType) return false;
    if (filterFrom){
      const f = new Date(filterFrom + 'T00:00:00');
      if (new Date(r.created_at) < f) return false;
    }
    if (filterTo){
      const t = new Date(filterTo + 'T23:59:59');
      if (new Date(r.created_at) > t) return false;
    }
    if (filterText){
      const q = filterText.toLowerCase();
      const hay = (r.name||'') + ' ' + (r.phone||'') + ' ' + (r.email||'') + ' ' + (r.event_name||'');
      if (!hay.toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

function paintReservasTable(){
  const list = filteredReservas();
  document.getElementById('resStats').innerHTML = `
    <div class="stats">
      <div class="stat-card"><div class="label">Total filtrado</div><div class="value pink">${list.length}</div></div>
      <div class="stat-card"><div class="label">Reservados</div><div class="value">${list.filter(r=>r.type==='reservado').length}</div></div>
      <div class="stat-card"><div class="label">Eventos</div><div class="value">${list.filter(r=>r.type==='evento').length}</div></div>
      <div class="stat-card"><div class="label">Cumpleaños</div><div class="value">${list.filter(r=>r.type==='cumpleanos').length}</div></div>
    </div>`;
  const wrap = document.querySelector('.table-wrap');
  if (!list.length){
    wrap.innerHTML = `<div class="empty">Ninguna reserva coincide con los filtros.</div>`;
    return;
  }
  wrap.innerHTML = `
    <table class="tbl">
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Tipo</th>
          <th>Evento</th>
          <th>Nombre</th>
          <th>Teléfono</th>
          <th class="hide-sm">Personas</th>
          <th class="hide-sm">Total</th>
        </tr>
      </thead>
      <tbody>
        ${list.map(r => rowHtml(r)).join('')}
      </tbody>
    </table>`;
  // Click to expand
  wrap.querySelectorAll('tbody tr.data-row').forEach(tr => {
    tr.addEventListener('click', () => {
      const id = tr.dataset.id;
      const exp = wrap.querySelector(`tr.expand-row[data-id="${id}"]`);
      if (exp){
        const isOpen = !exp.classList.contains('hidden');
        wrap.querySelectorAll('.expand-row').forEach(e => e.classList.add('hidden'));
        wrap.querySelectorAll('tr.data-row').forEach(e => e.classList.remove('expanded'));
        if (!isOpen){
          exp.classList.remove('hidden');
          tr.classList.add('expanded');
        }
      }
    });
  });
}

function rowHtml(r){
  const date = new Date(r.created_at);
  const dateStr = date.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'2-digit'}) + ' ' + date.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
  const type = r.type || 'mesa';
  const pillCls = 'pill-' + (type === 'cumpleanos' || type === 'cumpleaños' ? 'cumpleanos' : type);
  return `
    <tr class="data-row" data-id="${r.id}">
      <td class="muted">${dateStr}</td>
      <td><span class="pill ${pillCls}">${escapeHtml(type)}</span></td>
      <td>${escapeHtml(r.event_name || '—')}</td>
      <td><strong>${escapeHtml(r.name || '—')}</strong></td>
      <td><a href="tel:${escapeHtml(r.phone||'')}">${escapeHtml(r.phone || '—')}</a></td>
      <td class="hide-sm">${r.people ?? '—'}</td>
      <td class="hide-sm num">${escapeHtml(r.total || '—')}</td>
    </tr>
    <tr class="expand-row hidden" data-id="${r.id}">
      <td colspan="7">
        <div class="kv">
          ${kv('Email', r.email)}
          ${kv('Fecha evento', r.event_date)}
          ${kv('Botellas', r.bottles)}
          ${kv('Cachimbas', r.hookahs)}
          ${kv('Mezclas', r.mixers)}
          ${kv('Promo', r.promo)}
          ${kv('Comentarios', r.comments)}
        </div>
      </td>
    </tr>`;
}

function kv(k,v){
  if (!v) return '';
  return `<div class="kv-item"><span class="k">${escapeHtml(k)}</span><span class="v">${escapeHtml(v)}</span></div>`;
}

function exportReservasCSV(){
  const list = filteredReservas();
  const cols = ['created_at','type','event_name','event_date','name','phone','email','people','bottles','hookahs','mixers','total','promo','comments'];
  const csv = [cols.join(',')].concat(
    list.map(r => cols.map(c => csvCell(r[c])).join(','))
  ).join('\n');
  download(`reservas-shaona-${ymd()}.csv`, csv);
}

/* === TORNEO === */
async function renderTorneo(){
  const content = document.getElementById('tabContent');
  content.innerHTML = `
    <div class="toolbar">
      <select id="fEvent"></select>
      <button class="btn-ghost" id="refreshSc">↻ Recargar</button>
      <button class="btn-ghost" id="exportSc">Exportar CSV</button>
      <button class="btn-ghost danger" id="clearEvt">Borrar puntuaciones de este evento</button>
    </div>
    <div id="scStats"></div>
    <div class="table-wrap">
      <div class="loading">Cargando puntuaciones…</div>
    </div>`;
  document.getElementById('refreshSc').addEventListener('click', loadScores);
  document.getElementById('exportSc').addEventListener('click', exportScoresCSV);
  document.getElementById('clearEvt').addEventListener('click', clearEventScores);
  document.getElementById('fEvent').addEventListener('change', e => {
    currentEventId = e.target.value;
    paintScoresTable();
  });
  await loadScores();
}

async function loadScores(){
  const { data, error } = await supa.from('tournament_scores')
    .select('*')
    .order('created_at', { ascending: false })
    .limit(5000);
  if (error){
    document.querySelector('.table-wrap').innerHTML = `<div class="empty">Error: ${escapeHtml(error.message)}</div>`;
    return;
  }
  scores = data || [];
  availableEvents = [...new Set(scores.map(s => s.event_id))];
  if (!currentEventId || !availableEvents.includes(currentEventId)){
    currentEventId = availableEvents[0] || null;
  }
  const sel = document.getElementById('fEvent');
  sel.innerHTML = availableEvents.length
    ? availableEvents.map(id => `<option value="${escapeHtml(id)}" ${id===currentEventId?'selected':''}>${escapeHtml(id)}</option>`).join('')
    : `<option value="">— ningún evento con partidas —</option>`;
  paintScoresTable();
}

function bestPerPlayer(rows){
  const best = new Map();
  for (const r of rows){
    const existing = best.get(r.phone);
    if (!existing || r.score > existing.score) best.set(r.phone, r);
  }
  return [...best.values()].sort((a,b) => b.score - a.score);
}

function paintScoresTable(){
  const filtered = currentEventId ? scores.filter(s => s.event_id === currentEventId) : [];
  const best = bestPerPlayer(filtered);
  const totalGames = filtered.length;
  const uniquePlayers = new Set(filtered.map(s => s.phone)).size;
  const topScore = best[0]?.score || 0;

  document.getElementById('scStats').innerHTML = `
    <div class="stats">
      <div class="stat-card"><div class="label">Jugadores únicos</div><div class="value pink">${uniquePlayers}</div></div>
      <div class="stat-card"><div class="label">Partidas totales</div><div class="value">${totalGames}</div></div>
      <div class="stat-card"><div class="label">Mejor puntuación</div><div class="value cyan">${topScore}</div></div>
      <div class="stat-card"><div class="label">Evento</div><div class="value" style="font-size:1rem;line-height:1.3;padding-top:6px">${escapeHtml(currentEventId || '—')}</div></div>
    </div>`;

  const wrap = document.querySelector('.table-wrap');
  if (!best.length){
    wrap.innerHTML = `<div class="empty">Sin partidas para este evento.</div>`;
    return;
  }
  wrap.innerHTML = `
    <table class="tbl">
      <thead>
        <tr>
          <th>Posición</th>
          <th>Jugador</th>
          <th>Teléfono</th>
          <th>Mejor puntuación</th>
          <th class="hide-sm">Última partida</th>
        </tr>
      </thead>
      <tbody>
        ${best.map((r,i) => {
          const date = new Date(r.created_at);
          const dateStr = date.toLocaleDateString('es-ES') + ' ' + date.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
          const medal = ['🥇','🥈','🥉'][i] || '';
          return `<tr>
            <td><strong style="font-family:'Cormorant Garamond',serif;font-size:1.3rem">${i+1}${medal?' '+medal:''}</strong></td>
            <td>${escapeHtml(r.name)}</td>
            <td><a href="tel:${escapeHtml(r.phone)}">${escapeHtml(r.phone)}</a></td>
            <td class="num">${r.score}</td>
            <td class="hide-sm muted">${dateStr}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
}

function exportScoresCSV(){
  const filtered = currentEventId ? scores.filter(s => s.event_id === currentEventId) : scores;
  const best = bestPerPlayer(filtered);
  const cols = ['position','name','phone','best_score','last_played'];
  const csv = [cols.join(',')].concat(
    best.map((r,i) => [i+1, csvCell(r.name), csvCell(r.phone), r.score, csvCell(r.created_at)].join(','))
  ).join('\n');
  download(`torneo-${(currentEventId||'sin-evento')}-${ymd()}.csv`, csv);
}

async function clearEventScores(){
  if (!currentEventId) return;
  if (!confirm(`¿Borrar TODAS las puntuaciones del evento "${currentEventId}"?\n\nEsta acción no se puede deshacer.`)) return;
  const txt = prompt('Escribe BORRAR para confirmar:');
  if (txt !== 'BORRAR') return;
  const { error } = await supa.from('tournament_scores').delete().eq('event_id', currentEventId);
  if (error){
    alert('Error: ' + error.message);
    return;
  }
  alert('Borrado correctamente.');
  await loadScores();
}

/* === Utils === */
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function csvCell(v){
  if (v == null) return '';
  const s = String(v).replace(/"/g,'""');
  return /[",\n]/.test(s) ? `"${s}"` : s;
}
function ymd(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function download(filename, text){
  const blob = new Blob([text], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 0);
}

boot();
