<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · Shaona</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a0008">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230a0008'/%3E%3Ctext x='50' y='72' font-family='Georgia,serif' font-size='72' font-weight='700' fill='%23ff0055' text-anchor='middle' font-style='italic'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap">
<style>
/* ============================================================
   DESIGN SYSTEM
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:            #08060a;
  --bg-1:          #0f0a12;
  --bg-2:          #150c18;
  --bg-3:          #1c1121;
  --border:        rgba(255,255,255,.07);
  --border-hi:     rgba(255,255,255,.14);

  --text:          #f5f0f2;
  --text-2:        #b8b0b6;
  --muted:         #7a7080;
  --muted-2:       #55505a;

  --pink:          #ff0066;
  --pink-2:        #ff3388;
  --pink-soft:     rgba(255,0,102,.14);
  --cyan:          #00e0ff;
  --cyan-soft:     rgba(0,224,255,.14);
  --gold:          #ffc828;
  --gold-soft:     rgba(255,200,40,.14);
  --silver:        #dcdcef;
  --silver-soft:   rgba(220,220,239,.10);
  --bronze:        #ff7e3a;
  --bronze-soft:   rgba(255,126,58,.14);
  --green:         #4ade80;
  --green-soft:    rgba(74,222,128,.14);
  --red:           #ff5577;
  --red-soft:      rgba(255,85,119,.14);

  --shadow-sm:     0 2px 6px rgba(0,0,0,.35);
  --shadow-md:     0 8px 24px rgba(0,0,0,.4);
  --shadow-lg:     0 24px 60px -12px rgba(0,0,0,.6);
  --shadow-pink:   0 20px 60px -20px rgba(255,0,102,.5);

  --radius:        4px;
  --radius-lg:     8px;
  --sidebar:       220px;
  --header-h:      64px;
}
html,body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font-family:inherit;color:inherit}
::selection{background:var(--pink);color:#fff}

/* Scrollbar */
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:4px}
*::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.16)}

/* ============================================================
   LAYOUT — App shell
   ============================================================ */
.app{display:grid;grid-template-columns:var(--sidebar) 1fr;grid-template-rows:var(--header-h) 1fr;grid-template-areas:"header header" "sidebar main";min-height:100vh}

.app-header{
  grid-area:header;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;
  background:rgba(8,6,10,.85);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:40;
  height:var(--header-h);
}
.app-header .brand{display:flex;align-items:center;gap:14px}
.app-header .brand-logo{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:600;letter-spacing:.5px}
.app-header .brand-logo em{color:var(--pink);font-style:normal}
.app-header .brand-tag{font-size:.62rem;letter-spacing:3px;color:var(--cyan);text-transform:uppercase;border:1px solid var(--cyan);padding:3px 10px;border-radius:99px}
.app-header .header-right{display:flex;align-items:center;gap:14px}
.app-header .live-dot{display:inline-flex;align-items:center;gap:8px;font-size:.7rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.app-header .live-dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted);transition:background .3s ease,box-shadow .3s ease}
.app-header .live-dot.on{color:var(--green)}
.app-header .live-dot.on::before{background:var(--green);box-shadow:0 0 12px rgba(74,222,128,.6);animation:pulseGreen 2s infinite}
@keyframes pulseGreen{0%,100%{box-shadow:0 0 12px rgba(74,222,128,.6)}50%{box-shadow:0 0 24px rgba(74,222,128,.9)}}
.app-header .user-chip{font-size:.78rem;color:var(--text-2);display:flex;align-items:center;gap:8px}
.app-header .user-chip .avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--cyan));display:grid;place-items:center;color:#fff;font-weight:700;font-size:.72rem;text-transform:uppercase}
.hamburger{display:none;width:36px;height:36px;place-items:center;background:transparent;border:1px solid var(--border);border-radius:var(--radius)}
.hamburger svg{width:18px;height:18px;stroke:var(--text);fill:none;stroke-width:2}

/* Sidebar */
.sidebar{
  grid-area:sidebar;
  background:var(--bg-1);
  border-right:1px solid var(--border);
  padding:20px 12px;
  overflow-y:auto;
  position:sticky;
  top:var(--header-h);
  height:calc(100vh - var(--header-h));
}
.side-nav{display:flex;flex-direction:column;gap:2px}
.side-nav-item{
  display:flex;align-items:center;gap:12px;
  padding:11px 14px;border-radius:var(--radius);
  color:var(--text-2);font-size:.85rem;font-weight:500;
  cursor:pointer;transition:all .15s ease;
  border-left:2px solid transparent;
}
.side-nav-item:hover{background:rgba(255,255,255,.04);color:var(--text)}
.side-nav-item.active{background:var(--pink-soft);color:var(--pink);border-left-color:var(--pink)}
.side-nav-item .icon{width:20px;height:20px;display:grid;place-items:center;flex-shrink:0}
.side-nav-item .icon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.side-section{font-size:.62rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted-2);padding:20px 14px 8px}

/* Main */
.main{grid-area:main;padding:28px 32px 60px;overflow-x:hidden;min-width:0}
.view-title{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.view-title h1{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:600;line-height:1}
.view-title h1 em{color:var(--pink);font-style:italic}
.view-title .subtitle{font-size:.82rem;color:var(--muted);margin-top:4px;letter-spacing:.5px}

/* ============================================================
   COMPONENTS
   ============================================================ */
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;font-size:.76rem;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;border:1px solid var(--border);border-radius:var(--radius);background:transparent;color:var(--text);transition:all .15s ease}
.btn:hover{border-color:var(--border-hi);background:rgba(255,255,255,.03)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.primary:hover{background:var(--pink-2);border-color:var(--pink-2)}
.btn.ghost{background:transparent;border-color:var(--border)}
.btn.ghost:hover{border-color:var(--cyan);color:var(--cyan)}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.btn.icon-only{padding:9px;width:36px;height:36px;justify-content:center}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.sm{padding:6px 12px;font-size:.68rem}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.66rem;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;padding:4px 10px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.pill.pink{color:var(--pink);background:var(--pink-soft)}
.pill.cyan{color:var(--cyan);background:var(--cyan-soft)}
.pill.gold{color:var(--gold);background:var(--gold-soft)}
.pill.silver{color:var(--silver);background:var(--silver-soft)}
.pill.bronze{color:var(--bronze);background:var(--bronze-soft)}
.pill.green{color:var(--green);background:var(--green-soft)}
.pill.red{color:var(--red);background:var(--red-soft)}
.pill.muted{color:var(--muted);background:rgba(122,112,128,.14)}

/* Cards */
.card{background:linear-gradient(160deg,var(--bg-1) 0%,rgba(0,0,0,.4) 100%);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px 24px}
.card.hoverable{transition:all .2s ease}
.card.hoverable:hover{border-color:var(--border-hi);transform:translateY(-2px)}

/* Stat cards */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.stat{padding:20px 22px;background:linear-gradient(160deg,var(--bg-1) 0%,rgba(0,0,0,.4) 100%);border:1px solid var(--border);border-radius:var(--radius-lg);position:relative;overflow:hidden}
.stat .label{font-size:.66rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.stat .value{font-family:'Outfit',sans-serif;font-size:2.4rem;font-weight:700;line-height:1;color:var(--text);letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat .value.pink{color:var(--pink)}
.stat .value.cyan{color:var(--cyan)}
.stat .value.gold{color:var(--gold)}
.stat .value.green{color:var(--green)}
.stat .foot{font-size:.75rem;color:var(--muted);margin-top:10px}
.stat .icon-bg{position:absolute;right:-8px;top:50%;transform:translateY(-50%);width:60px;height:60px;opacity:.06}
.stat .icon-bg svg{width:100%;height:100%;stroke:var(--text);fill:none;stroke-width:1}

/* Table */
.table-card{background:linear-gradient(160deg,var(--bg-1) 0%,rgba(0,0,0,.4) 100%);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.tbl{width:100%;border-collapse:collapse;font-size:.86rem}
.tbl thead{background:rgba(0,0,0,.35)}
.tbl th{text-align:left;padding:14px 18px;font-size:.66rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap;user-select:none}
.tbl th.sortable{cursor:pointer;transition:color .15s ease}
.tbl th.sortable:hover{color:var(--text)}
.tbl th.sortable .arrow{opacity:.4;margin-left:4px;font-size:.7rem}
.tbl th.sortable.active .arrow{opacity:1;color:var(--pink)}
.tbl td{padding:14px 18px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--text)}
.tbl tbody tr{transition:background .12s ease}
.tbl tbody tr:hover{background:rgba(255,0,102,.03)}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl .muted{color:var(--muted)}
.tbl .num{font-variant-numeric:tabular-nums;font-weight:600}
.tbl .name-cell strong{display:block;font-size:.94rem;font-weight:600}
.tbl .name-cell small{display:block;color:var(--muted);font-size:.74rem;margin-top:2px}
.tbl .actions{display:flex;gap:4px;justify-content:flex-end}
.tbl .actions .btn{padding:6px;width:30px;height:30px;justify-content:center}
.tbl tr.row-btn{cursor:pointer}

/* Toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.toolbar .search{flex:1;min-width:200px;position:relative}
.toolbar .search input{width:100%;background:var(--bg-1);border:1px solid var(--border);color:var(--text);padding:10px 14px 10px 38px;font-size:.86rem;border-radius:var(--radius);transition:border-color .15s ease}
.toolbar .search input:focus{outline:none;border-color:var(--pink)}
.toolbar .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
.toolbar select,.toolbar input[type="date"]{background:var(--bg-1);border:1px solid var(--border);color:var(--text);padding:10px 12px;font-size:.85rem;border-radius:var(--radius);transition:border-color .15s ease}
.toolbar select:focus,.toolbar input[type="date"]:focus{outline:none;border-color:var(--pink)}
.toolbar input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(1) hue-rotate(180deg);opacity:.6}

/* Date range picker */
.date-picker{position:relative}
.date-picker-btn{display:inline-flex;align-items:center;gap:10px;background:var(--bg-1);border:1px solid var(--border);color:var(--text);padding:10px 14px;font-size:.85rem;border-radius:var(--radius);cursor:pointer;transition:border-color .15s ease;font-family:inherit;min-width:210px}
.date-picker-btn:hover{border-color:var(--border-hi)}
.date-picker.open .date-picker-btn{border-color:var(--pink)}
.date-picker-btn .ic{width:16px;height:16px;stroke:var(--pink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.date-picker-btn .chev{width:14px;height:14px;margin-left:auto;opacity:.5;stroke:currentColor;fill:none;stroke-width:2;transition:transform .2s ease}
.date-picker.open .date-picker-btn .chev{transform:rotate(180deg)}
.date-picker-btn .lbl{flex:1;text-align:left}

.date-picker-popover{position:absolute;top:calc(100% + 6px);right:0;left:auto;z-index:30;background:linear-gradient(160deg,var(--bg-1) 0%,var(--bg-2) 100%);border:1px solid var(--border-hi);border-radius:var(--radius-lg);padding:14px;box-shadow:var(--shadow-lg);display:none;min-width:320px;max-width:calc(100vw - 24px)}
.date-picker.open .date-picker-popover{display:block}
@media (max-width:640px){
  .date-picker{width:100%}
  .date-picker-btn{width:100%;min-width:0}
  .date-picker-popover{left:0;right:auto;min-width:0;width:100%}
}

/* Presets como chips arriba */
.dp-presets{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:12px}
.dp-preset{background:transparent;border:1px solid var(--border);color:var(--text-2);padding:6px 12px;border-radius:99px;font-size:.72rem;font-weight:600;cursor:pointer;transition:all .15s ease;font-family:inherit}
.dp-preset:hover{border-color:var(--border-hi);color:var(--text)}
.dp-preset.active{background:var(--pink);border-color:var(--pink);color:#fff}

/* Calendar */
.dp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.dp-nav{background:transparent;border:1px solid var(--border);color:var(--text);width:30px;height:30px;border-radius:6px;cursor:pointer;font-size:1.1rem;line-height:1;display:grid;place-items:center;transition:all .15s ease}
.dp-nav:hover{border-color:var(--pink);color:var(--pink)}
.dp-title{font-weight:600;font-size:.9rem;text-transform:capitalize;letter-spacing:.5px}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dp-dow{font-size:.62rem;color:var(--muted);text-align:center;letter-spacing:1px;text-transform:uppercase;padding:6px 0;font-weight:600}
.dp-day{aspect-ratio:1;min-width:36px;display:grid;place-items:center;font-size:.82rem;cursor:pointer;color:var(--text);transition:background .12s ease;border-radius:6px;font-variant-numeric:tabular-nums;user-select:none}
.dp-day:hover{background:rgba(255,0,102,.15)}
.dp-day.other-month{color:var(--muted-2);opacity:.35}
.dp-day.today{outline:1px solid rgba(255,0,102,.4);outline-offset:-1px}
.dp-day.in-range{background:rgba(255,0,102,.18);border-radius:0}
.dp-day.start,.dp-day.end{background:var(--pink);color:#fff;font-weight:700}
.dp-day.start{border-radius:6px 0 0 6px}
.dp-day.end{border-radius:0 6px 6px 0}
.dp-day.start.end{border-radius:6px}
.dp-day.start:hover,.dp-day.end:hover{background:var(--pink-2)}

/* Filter chips */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:7px 14px;font-size:.75rem;font-weight:500;background:var(--bg-1);border:1px solid var(--border);border-radius:99px;cursor:pointer;transition:all .15s ease;color:var(--text-2);display:inline-flex;align-items:center;gap:8px}
.chip:hover{border-color:var(--border-hi);color:var(--text)}
.chip.active{background:var(--pink);border-color:var(--pink);color:#fff}
.chip .count{opacity:.7;font-size:.72rem;font-variant-numeric:tabular-nums}

/* Empty / loading states */
.empty,.loading{padding:60px 24px;text-align:center;color:var(--muted)}
.empty .icon,.loading .icon{width:48px;height:48px;margin:0 auto 16px;opacity:.3}
.empty .icon svg,.loading .icon svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.5}
.empty h3{color:var(--text-2);font-size:1rem;font-weight:500;margin-bottom:6px}
.empty p{font-size:.85rem;line-height:1.5;max-width:340px;margin:0 auto}
.loading .spinner{width:24px;height:24px;margin:0 auto 12px;border:2px solid var(--border);border-top-color:var(--pink);border-radius:50%;animation:spin 1s linear infinite}
.loading p{font-size:.82rem;letter-spacing:1px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Toast */
.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:100;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--bg-2);border:1px solid var(--border-hi);border-left:3px solid var(--pink);padding:14px 20px;border-radius:var(--radius);box-shadow:var(--shadow-md);max-width:360px;font-size:.87rem;pointer-events:auto;animation:toastIn .3s ease}
.toast.success{border-left-color:var(--green)}
.toast.error{border-left-color:var(--red)}
.toast.info{border-left-color:var(--cyan)}
.toast .t-title{font-weight:600;margin-bottom:2px}
.toast .t-msg{color:var(--text-2);font-size:.82rem;line-height:1.4}
@keyframes toastIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:80;display:none;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s ease}
.modal-overlay.open{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:640px;max-height:90vh;overflow:auto;background:var(--bg-1);border:1px solid var(--border-hi);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);animation:modalIn .25s ease}
.modal.sm{max-width:440px}
@keyframes modalIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-head{padding:22px 26px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;border-bottom:1px solid var(--border)}
.modal-head .title{font-family:'Cormorant Garamond',serif;font-size:1.6rem;line-height:1.15;font-weight:600}
.modal-head .title em{color:var(--pink);font-style:italic}
.modal-head .subtitle{font-size:.78rem;color:var(--muted);margin-top:4px;letter-spacing:.5px}
.modal-close{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--border);border-radius:50%;flex-shrink:0;transition:all .15s ease}
.modal-close:hover{border-color:var(--red);color:var(--red)}
.modal-body{padding:22px 26px}
.modal-foot{padding:16px 26px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--border)}

/* Form inputs (modal) */
.form-row{margin-bottom:16px}
.form-row label{display:block;font-size:.68rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.form-row input,.form-row select,.form-row textarea{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:11px 14px;font-size:.9rem;border-radius:var(--radius);transition:border-color .15s ease}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{outline:none;border-color:var(--pink)}

/* Password toggle */
.password-wrap{position:relative}
.password-wrap input{padding-right:44px}
.password-toggle{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:var(--muted);width:36px;height:36px;cursor:pointer;display:grid;place-items:center;border-radius:6px;transition:color .15s ease}
.password-toggle:hover{color:var(--pink)}
.password-toggle svg{width:18px;height:18px}
.password-toggle .eye-off{display:none}
.password-toggle.visible .eye-on{display:none}
.password-toggle.visible .eye-off{display:block;color:var(--pink)}
.form-row textarea{resize:vertical;min-height:80px;font-family:inherit}
.form-error{color:var(--red);font-size:.82rem;margin-top:10px;min-height:1.2em}

/* Key-value grid */
.kv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 22px}
.kv-item .k{display:block;font-size:.66rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.kv-item .v{color:var(--text);font-size:.9rem;word-break:break-word;line-height:1.4}
.kv-item .v.big{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:600}

/* Bloques destacados para pedidos (botellas / cachimbas / mezclas) */
.kv-item.kv-full{grid-column:1 / -1}
.detail-block{background:linear-gradient(160deg,rgba(255,0,102,.09),rgba(255,0,102,.03));border:1px solid rgba(255,0,102,.28);border-radius:10px;padding:14px 18px;margin-top:6px}
.detail-block .db-count{font-family:'Outfit',sans-serif;font-size:1.35rem;font-weight:800;color:var(--pink);letter-spacing:1.5px;text-transform:uppercase;line-height:1.05;margin-bottom:6px;font-variant-numeric:tabular-nums}
.detail-block .db-body{font-family:'Outfit',sans-serif;font-size:1.05rem;color:var(--text);line-height:1.55;font-weight:500}
.detail-block .db-body b{color:var(--pink);font-weight:700}
.detail-block .db-list{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.detail-block .db-item{font-family:'Outfit',sans-serif;font-size:1.05rem;color:var(--text);line-height:1.35;font-weight:500;display:flex;align-items:baseline;gap:10px}
.detail-block .db-item b{color:var(--pink);font-weight:800;font-size:1.15rem;min-width:28px;text-align:right;font-variant-numeric:tabular-nums}
.detail-block .db-extra{margin-top:10px;font-size:.78rem;color:var(--muted);font-style:italic;padding-top:8px;border-top:1px dashed var(--border)}
.detail-block.cyan{background:linear-gradient(160deg,rgba(0,224,255,.09),rgba(0,224,255,.03));border-color:rgba(0,224,255,.28)}
.detail-block.cyan .db-count{color:var(--cyan)}
.detail-block.cyan .db-body b{color:var(--cyan)}
.detail-block.gold{background:linear-gradient(160deg,rgba(255,200,40,.09),rgba(255,200,40,.03));border-color:rgba(255,200,40,.28)}
.detail-block.gold .db-count{color:var(--gold)}
.detail-block.gold .db-body b{color:var(--gold)}
.kv-item .v a{color:var(--cyan);border-bottom:1px dashed var(--cyan);padding-bottom:1px}

/* Section header */
.section-h{display:flex;align-items:center;justify-content:space-between;margin:28px 0 12px;gap:12px;flex-wrap:wrap}
.section-h h2{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:600;line-height:1}
.section-h h2 em{color:var(--pink);font-style:italic}
.section-h .side{font-size:.76rem;color:var(--muted)}

/* Podium (torneo) */
.podium{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:14px;margin:20px 0;align-items:end}
.step{background:linear-gradient(160deg,var(--bg-1),rgba(0,0,0,.5));border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px 20px;text-align:center;position:relative;overflow:hidden;transition:transform .2s ease}
.step:hover{transform:translateY(-4px)}
.step .medal{font-size:2.4rem;line-height:1;margin-bottom:10px}
.step .pos{font-family:'Cormorant Garamond',serif;font-size:2.8rem;font-weight:700;line-height:1;margin-bottom:6px}
.step .name{font-size:1.05rem;font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px;word-break:break-word}
.step .phone{font-size:.75rem;color:var(--muted);margin-bottom:12px;font-variant-numeric:tabular-nums}
.step .score{font-family:'Cormorant Garamond',serif;font-size:1.6rem;color:var(--cyan);font-weight:600;margin-bottom:14px}
.step .prize{font-size:.78rem;color:var(--text-2);line-height:1.4;padding:10px 8px;background:rgba(0,0,0,.35);border-radius:var(--radius);margin-bottom:14px;min-height:2.4em}
.step.p1{background:linear-gradient(160deg,rgba(255,200,40,.14),rgba(0,0,0,.6));border-color:rgba(255,200,40,.35);padding:32px 20px}
.step.p1 .pos{color:var(--gold);font-size:3.4rem}
.step.p2{background:linear-gradient(160deg,rgba(220,220,239,.10),rgba(0,0,0,.6));border-color:rgba(220,220,239,.28)}
.step.p2 .pos{color:var(--silver)}
.step.p3{background:linear-gradient(160deg,rgba(255,126,58,.14),rgba(0,0,0,.6));border-color:rgba(255,126,58,.32)}
.step.p3 .pos{color:var(--bronze)}
.step .delivered-badge{display:inline-flex;align-items:center;gap:6px;font-size:.66rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--green);margin-top:6px}
.step.empty-slot{opacity:.35;background:linear-gradient(160deg,var(--bg-1),rgba(0,0,0,.4));border-style:dashed}
.step.empty-slot .name{color:var(--muted)}

/* Login */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden}
.login-wrap::before{content:"";position:absolute;top:-30%;left:50%;transform:translateX(-50%);width:900px;height:600px;background:radial-gradient(circle,rgba(255,0,102,.14) 0%,transparent 60%);pointer-events:none;z-index:0}
.login-card{position:relative;z-index:1;width:100%;max-width:420px;background:linear-gradient(160deg,var(--bg-1),rgba(0,0,0,.6));border:1px solid var(--border);border-radius:var(--radius-lg);padding:44px 36px;box-shadow:var(--shadow-lg)}
.login-card .brand{margin-bottom:22px;font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:600;letter-spacing:.5px}
.login-card .brand em{color:var(--pink);font-style:normal}
.login-card h1{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:600;line-height:1.1;margin-bottom:6px}
.login-card h1 em{color:var(--pink);font-style:italic}
.login-card .sub{color:var(--muted);font-size:.86rem;margin-bottom:26px}

/* No-config state */
.no-config{max-width:520px;margin:80px auto;text-align:center}
.no-config h2{font-family:'Cormorant Garamond',serif;font-size:2rem;color:var(--pink);margin-bottom:14px}
.no-config p{color:var(--muted);font-size:.92rem;line-height:1.6;margin-bottom:12px}
.no-config code{background:var(--bg-1);color:var(--pink);padding:2px 8px;font-family:'SF Mono',Menlo,monospace;font-size:.82rem;border-radius:4px}

/* Utilities */
.hidden{display:none !important}
.flex{display:flex}
.gap-6{gap:6px}.gap-8{gap:8px}.gap-12{gap:12px}
.mt-8{margin-top:8px}.mt-16{margin-top:16px}
.text-c{text-align:center}
.grow{flex:1}

/* Responsive */
@media (max-width:960px){
  :root{--sidebar:0px}
  .app{grid-template-columns:1fr;grid-template-areas:"header" "main"}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:260px;z-index:60;transform:translateX(-100%);transition:transform .25s ease;padding-top:calc(var(--header-h) + 12px)}
  .sidebar.open{transform:translateX(0);box-shadow:var(--shadow-lg)}
  .sidebar-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:55;display:none}
  .sidebar-backdrop.open{display:block}
  .hamburger{display:grid}
  .main{padding:20px 16px 60px}
  .app-header{padding:0 16px}
  .app-header .live-dot{display:none}
  .podium{grid-template-columns:1fr;gap:10px}
  .podium .step.p1{order:-1}
  .step.p1{padding:24px 20px}
  .hide-sm{display:none !important}
  .tbl th,.tbl td{padding:12px 14px;font-size:.82rem}
  .view-title h1{font-size:1.7rem}
  .modal{max-height:100vh}
  .toast-wrap{right:12px;left:12px;bottom:12px}
  .toast{max-width:none}
}

/* ============================================================
   ESTADÍSTICAS — gráficos SVG
   ============================================================ */
.stats-view .period-chips{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.stats-view .period-chip{background:var(--bg-1);border:1px solid var(--border);color:var(--text-2);padding:8px 16px;border-radius:99px;font-size:.76rem;font-weight:600;cursor:pointer;transition:all .15s ease}
.stats-view .period-chip:hover{border-color:var(--border-hi);color:var(--text)}
.stats-view .period-chip.active{background:var(--pink);border-color:var(--pink);color:#fff}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.kpi{background:linear-gradient(160deg,var(--bg-1) 0%,rgba(0,0,0,.4) 100%);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 22px;position:relative}
.kpi .kpi-label{font-size:.66rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;font-weight:600}
.kpi .kpi-value{font-family:'Outfit',sans-serif;font-size:2.4rem;font-weight:800;line-height:1;letter-spacing:-.5px;font-variant-numeric:tabular-nums;color:var(--text)}
.kpi .kpi-value.pink{color:var(--pink)} .kpi .kpi-value.cyan{color:var(--cyan)} .kpi .kpi-value.green{color:var(--green)} .kpi .kpi-value.gold{color:var(--gold)}
.kpi .kpi-delta{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:600;margin-top:8px;padding:3px 8px;border-radius:99px}
.kpi .kpi-delta.up{color:var(--green);background:var(--green-soft,rgba(74,222,128,.14))}
.kpi .kpi-delta.down{color:var(--red);background:var(--red-soft,rgba(255,85,119,.14))}
.kpi .kpi-delta.flat{color:var(--muted);background:rgba(122,112,128,.14)}
.kpi .kpi-foot{font-size:.72rem;color:var(--muted);margin-top:8px}

.chart-card{background:linear-gradient(160deg,var(--bg-1) 0%,rgba(0,0,0,.4) 100%);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px 24px;margin-bottom:16px}
.chart-card h3{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:600;margin-bottom:6px}
.chart-card .chart-sub{font-size:.78rem;color:var(--muted);margin-bottom:16px}
.chart-svg{width:100%;height:auto;display:block}
.chart-bar{transition:opacity .15s ease}
.chart-bar:hover{opacity:.75}
.chart-axis{font-size:10px;fill:var(--muted);font-family:'Outfit',sans-serif}
.chart-grid{stroke:var(--border);stroke-dasharray:2 4;opacity:.5}

.type-breakdown{display:flex;flex-direction:column;gap:12px}
.type-row{display:grid;grid-template-columns:120px 1fr 60px;gap:14px;align-items:center;font-size:.86rem}
.type-row .type-name{font-weight:600;text-transform:capitalize}
.type-row .type-bar{background:rgba(255,255,255,.05);border-radius:99px;height:10px;overflow:hidden;position:relative}
.type-row .type-bar-fill{height:100%;border-radius:99px;transition:width .5s ease}
.type-row .type-count{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-family:'Outfit',sans-serif}

.chart-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.top-events{display:flex;flex-direction:column;gap:8px}
.top-event{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px}
.top-event .rank{font-family:'Cormorant Garamond',serif;font-weight:700;color:var(--pink);font-size:1.15rem;font-variant-numeric:tabular-nums}
.top-event .name{font-size:.9rem;font-weight:500}
.top-event .count{font-size:.9rem;font-weight:700;color:var(--cyan);font-variant-numeric:tabular-nums}

@media (max-width:960px){
  .kpi-grid{grid-template-columns:1fr 1fr}
  .chart-grid-2{grid-template-columns:1fr}
}
@media (max-width:640px){
  .kpi-grid{gap:8px}
  .kpi{padding:14px 16px}
  .kpi .kpi-value{font-size:1.9rem}
  .type-row{grid-template-columns:80px 1fr 40px;gap:8px;font-size:.78rem}
}

/* En móvil (< 640px): tablas se transforman en tarjetas apiladas */
@media (max-width:640px){
  .main{padding:16px 12px 60px}
  .table-card{background:transparent;border:none;padding:0;overflow:visible}
  .tbl{display:block}
  .tbl thead{display:none}
  .tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tbody{display:flex;flex-direction:column;gap:8px}
  .tbl tbody tr{background:linear-gradient(160deg,var(--bg-1) 0%,rgba(0,0,0,.4) 100%);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
  .tbl tbody tr:hover{background:linear-gradient(160deg,var(--bg-2) 0%,rgba(0,0,0,.4) 100%)}
  .tbl tbody td{padding:5px 0;border:none;font-size:.86rem}
  .tbl tbody td.hide-sm{display:block !important}
  .tbl tbody td[data-label]::before{content:attr(data-label);display:block;font-size:.58rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:3px}
  .tbl tbody td[data-label="Acciones"]{padding-top:10px;margin-top:4px;border-top:1px solid var(--border)}
  .tbl tbody td[data-label="Acciones"]::before{display:none}
  .tbl .actions{justify-content:flex-start;flex-wrap:wrap;gap:8px}
  .tbl .actions .btn{width:auto;height:auto;padding:8px 12px;flex:1}
  .toolbar{gap:8px}
  .toolbar select,.toolbar .search{width:100%;min-width:0}
  .toolbar .search{order:-1}
  .chips{gap:6px}
  .chip{font-size:.7rem;padding:6px 10px}
  .view-title{gap:10px}
  .stats-grid{grid-template-columns:1fr 1fr}
  .stats-grid .stat .value{font-size:1.9rem}
  .toolbar > .btn{flex:1}
  .modal-body .kv-grid{grid-template-columns:1fr}
}
</style>

<body>

<div id="app-root"></div>

<div class="toast-wrap" id="toastWrap"></div>
<div class="modal-overlay" id="modalOverlay"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script src="shaona-config.js"></script>
<script>
/* ============================================================
   ADMIN — Shaona
   SPA con dashboard, reservas, torneo. Auth via Supabase.
   ============================================================ */

// ---------- Supabase ----------
const CFG = window.SHAONA_CONFIG || {};
const supa = (window.supabase && CFG.supabaseUrl && CFG.supabaseAnonKey)
  ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {
      auth: { persistSession: true, autoRefreshToken: true }
    })
  : null;

// ---------- State ----------
const state = {
  session:      null,
  view:         'dashboard',       // dashboard | reservas | torneo
  reservations: [],
  scores:       [],
  events:       [],
  currentEventId: null,
  quickFilter:  'todas',           // hoy | semana | mes | pendientes | todas
  filters: {
    type: 'all', status: 'all', from: '', to: '', text: ''
  },
  sort: { key: 'created_at', dir: 'desc' },
  realtimeOn:   false,
  sidebarOpen:  false,
  statsPeriod:  '30d'          // 7d | 30d | 12m | year
};

// ---------- SVG icons ----------
const ICONS = {
  dashboard: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="5" rx="1"/><rect x="13" y="10" width="8" height="11" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/></svg>',
  book:      '<svg viewBox="0 0 24 24"><path d="M4 5v14a2 2 0 002 2h13V3H6a2 2 0 00-2 2z"/><path d="M9 8h7M9 12h7M9 16h4"/></svg>',
  trophy:    '<svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M6 4h12v5a6 6 0 01-12 0V4z"/><path d="M6 5H4a2 2 0 000 4h2M18 5h2a2 2 0 010 4h-2"/></svg>',
  search:    '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>',
  users:     '<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H7a4 4 0 00-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13A4 4 0 0116 11"/></svg>',
  calendar:  '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  clock:     '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
  gift:      '<svg viewBox="0 0 24 24"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 010-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 000-5C13 2 12 7 12 7z"/></svg>',
  x:         '<svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  check:     '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>',
  edit:      '<svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>',
  trash:     '<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 01-2 2H9a2 2 0 01-2-2L5 6M10 11v6M14 11v6"/></svg>',
  eye:       '<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>',
  phone:     '<svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13 1 .37 1.96.72 2.88a2 2 0 01-.45 2.11L8.09 10.09a16 16 0 006 6l1.38-1.38a2 2 0 012.11-.45c.92.35 1.88.59 2.88.72A2 2 0 0122 16.92z"/></svg>',
  download:  '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
  refresh:   '<svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>',
  logout:    '<svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>',
  bell:      '<svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg>',
  empty:     '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 15s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg>',
  menu:      '<svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>',
  chevron:   '<svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>',
  crown:     '<svg viewBox="0 0 24 24"><path d="M2 20h20l-2-12-5 4-5-8-5 8-5-4z"/></svg>',
  bar:       '<svg viewBox="0 0 24 24"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>'
};

// ---------- Helpers ----------
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => [...root.querySelectorAll(sel)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isoDate = d => new Date(d).toISOString().slice(0,10);
const startOfDay = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const endOfDay   = d => { const x = new Date(d); x.setHours(23,59,59,999); return x; };
const fmtDate = d => new Date(d).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'2-digit'});
const fmtDateTime = d => {
  const dt = new Date(d);
  return dt.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'2-digit'}) + ' ' +
         dt.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
};
const fmtRelative = d => {
  const diff = (Date.now() - new Date(d).getTime()) / 1000;
  if (diff < 60) return 'ahora mismo';
  if (diff < 3600) return `hace ${Math.floor(diff/60)} min`;
  if (diff < 86400) return `hace ${Math.floor(diff/3600)} h`;
  if (diff < 604800) return `hace ${Math.floor(diff/86400)} d`;
  return fmtDate(d);
};
const phoneClean = p => (p||'').replace(/[^0-9+]/g,'');
const waLink = p => `https://wa.me/${phoneClean(p).replace(/^\+?/, '34').replace(/^3434/, '34')}`;

// ---------- Toasts ----------
function toast(title, msg='', kind='info', timeout=3800){
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.innerHTML = `<div class="t-title">${esc(title)}</div>${msg?`<div class="t-msg">${esc(msg)}</div>`:''}`;
  $('#toastWrap').appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .3s ease, transform .3s ease';
    el.style.opacity = '0';
    el.style.transform = 'translateX(20px)';
    setTimeout(() => el.remove(), 320);
  }, timeout);
}

// ---------- Modal ----------
function modal({ title, subtitle='', body='', size='', actions=[], onClose }={}){
  const overlay = $('#modalOverlay');
  overlay.innerHTML = `
    <div class="modal ${size}">
      <div class="modal-head">
        <div>
          <div class="title">${title}</div>
          ${subtitle?`<div class="subtitle">${subtitle}</div>`:''}
        </div>
        <button class="modal-close" data-close aria-label="Cerrar">${ICONS.x}</button>
      </div>
      <div class="modal-body">${body}</div>
      ${actions.length?`<div class="modal-foot">${actions.map((a,i)=>`<button class="btn ${a.cls||''}" data-action="${i}">${a.icon?a.icon:''}${esc(a.label)}</button>`).join('')}</div>`:''}
    </div>`;
  overlay.classList.add('open');
  const close = () => {
    overlay.classList.remove('open');
    overlay.innerHTML = '';
    document.removeEventListener('keydown', onKey);
    if (onClose) onClose();
  };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  overlay.querySelector('[data-close]').addEventListener('click', close);
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  actions.forEach((a,i) => {
    const btn = overlay.querySelector(`[data-action="${i}"]`);
    if (btn) btn.addEventListener('click', () => a.onClick && a.onClick(close));
  });
  return close;
}

function confirmModal({ title, message, danger=false, confirmLabel='Confirmar', onConfirm }){
  modal({
    title, size:'sm',
    body: `<p style="color:var(--text-2);line-height:1.55;font-size:.95rem">${message}</p>`,
    actions: [
      { label:'Cancelar', cls:'ghost', onClick: close => close() },
      { label: confirmLabel, cls: danger ? 'primary danger' : 'primary',
        onClick: async close => { await onConfirm(); close(); } }
    ]
  });
}

/* ============================================================
   DATA
   ============================================================ */
let dataLoaded = false;
async function ensureData(force=false){
  if (dataLoaded && !force) return;
  const [rRes, rSco] = await Promise.all([
    supa.from('reservations').select('*').order('created_at',{ascending:false}).limit(3000),
    supa.from('tournament_scores').select('*').order('created_at',{ascending:false}).limit(5000)
  ]);
  if (rRes.error){ toast('Error cargando reservas', rRes.error.message, 'error'); return; }
  if (rSco.error){ toast('Error cargando puntuaciones', rSco.error.message, 'error'); return; }
  state.reservations = rRes.data || [];
  state.scores = rSco.data || [];
  state.events = [...new Set(state.scores.map(s => s.event_id))];
  if (!state.currentEventId || !state.events.includes(state.currentEventId)){
    state.currentEventId = state.events[0] || null;
  }
  dataLoaded = true;
}

function ensureRealtime(){
  if (state.realtimeOn || !supa) return;
  const channel = supa.channel('admin-live')
    .on('postgres_changes', { event:'*', schema:'public', table:'reservations' }, payload => {
      handleRealtime('reservations', payload);
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'tournament_scores' }, payload => {
      handleRealtime('tournament_scores', payload);
    })
    .subscribe(status => {
      if (status === 'SUBSCRIBED'){
        state.realtimeOn = true;
        const dot = $('#liveDot');
        if (dot) dot.classList.add('on');
      }
    });
}

function handleRealtime(table, payload){
  const arr = table === 'reservations' ? state.reservations : state.scores;
  const key = 'id';
  if (payload.eventType === 'INSERT'){
    arr.unshift(payload.new);
    if (table === 'reservations'){
      toast('Nueva reserva', `${payload.new.name || 'Sin nombre'} — ${payload.new.type || 'mesa'}`, 'success', 5000);
    } else {
      toast('Nueva partida', `${payload.new.name} · ${payload.new.score} pts`, 'info', 3000);
      if (!state.events.includes(payload.new.event_id)){
        state.events.push(payload.new.event_id);
      }
    }
  } else if (payload.eventType === 'UPDATE'){
    const idx = arr.findIndex(x => x[key] === payload.new[key]);
    if (idx >= 0) arr[idx] = payload.new;
  } else if (payload.eventType === 'DELETE'){
    const idx = arr.findIndex(x => x[key] === payload.old[key]);
    if (idx >= 0) arr.splice(idx, 1);
  }
  routeToView();
}

function quickChip(id, label){
  const list = filteredReservationsForChip(id);
  return `<div class="chip ${state.quickFilter===id?'active':''}" data-q="${id}">${label} <span class="count">${list.length}</span></div>`;
}

function filteredReservationsForChip(chip){
  const now = new Date();
  const startToday = startOfDay(now), endToday = endOfDay(now);
  const startWeek  = startOfDay(new Date(now.getTime() - 6*86400000));
  const startMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  return state.reservations.filter(r => {
    const d = new Date(r.created_at);
    if (chip === 'hoy')        return d >= startToday && d <= endToday;
    if (chip === 'semana')     return d >= startWeek  && d <= endToday;
    if (chip === 'mes')        return d >= startMonth && d <= endToday;
    if (chip === 'pendientes') return r.status === 'pendiente';
    return true;
  });
}

function filteredReservations(){
  let list = filteredReservationsForChip(state.quickFilter);
  const f = state.filters;
  if (f.type !== 'all')   list = list.filter(r => r.type === f.type);
  if (f.status !== 'all') list = list.filter(r => r.status === f.status);
  if (f.from){
    const from = startOfDay(f.from);
    list = list.filter(r => new Date(r.created_at) >= from);
  }
  if (f.to){
    const to = endOfDay(f.to);
    list = list.filter(r => new Date(r.created_at) <= to);
  }
  if (f.text){
    const q = f.text.toLowerCase();
    list = list.filter(r => {
      const hay = (r.name||'') + ' ' + (r.phone||'') + ' ' + (r.email||'') + ' ' + (r.event_name||'') + ' ' + (r.comments||'');
      return hay.toLowerCase().includes(q);
    });
  }
  // sort
  const { key, dir } = state.sort;
  list = [...list].sort((a,b) => {
    const av = a[key], bv = b[key];
    if (av == null) return 1; if (bv == null) return -1;
    const cmp = av > bv ? 1 : av < bv ? -1 : 0;
    return dir === 'asc' ? cmp : -cmp;
  });
  return list;
}

  $$('tr.row-btn', el).forEach(tr => tr.addEventListener('click', () => openReservationModal(tr.dataset.id)));
  // View button (same)
  $$('button[data-view]', el).forEach(btn => btn.addEventListener('click', e => {
    e.stopPropagation();
    openReservationModal(btn.dataset.view);
  }));
  // Sort
  $$('th.sortable', el).forEach(h => h.addEventListener('click', () => {
    const k = h.dataset.sort;
    if (state.sort.key === k) state.sort.dir = state.sort.dir === 'asc' ? 'desc' : 'asc';
    else { state.sort.key = k; state.sort.dir = 'desc'; }
    paintReservationsTable();
  }));
}

/* ============================================================
   DATE RANGE PICKER — un solo botón, popover con presets + calendario
   ============================================================ */
const DP_MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DP_DOW    = ['L','M','X','J','V','S','D'];
const dp = { open:false, viewY:new Date().getFullYear(), viewM:new Date().getMonth() };

function dpIso(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function dpFromIso(s){ return s ? new Date(s+'T00:00:00') : null; }

function dpLabel(){
  const f = state.filters.from, t = state.filters.to;
  if (!f && !t) return 'Cualquier fecha';
  const fmt = d => dpFromIso(d).toLocaleDateString('es-ES',{day:'2-digit',month:'short'});
  if (f && !t) return `Desde ${fmt(f)}`;
  if (!f && t) return `Hasta ${fmt(t)}`;
  if (f === t) return fmt(f);
  return `${fmt(f)} – ${fmt(t)}`;
}

function dpActivePreset(){
  const f = state.filters.from, t = state.filters.to;
  if (!f && !t) return 'clear';
  const iso = dpIso;
  const today = new Date(), y = today.getFullYear(), m = today.getMonth();
  const yst = new Date(today); yst.setDate(yst.getDate()-1);
  const w7 = new Date(today); w7.setDate(w7.getDate()-6);
  const w30 = new Date(today); w30.setDate(w30.getDate()-29);
  const mStart = new Date(y,m,1), mPrevStart = new Date(y,m-1,1), mPrevEnd = new Date(y,m,0);
  if (f===iso(today) && t===iso(today)) return 'hoy';
  if (f===iso(yst)   && t===iso(yst))   return 'ayer';
  if (f===iso(w7)    && t===iso(today)) return '7d';
  if (f===iso(w30)   && t===iso(today)) return '30d';
  if (f===iso(mStart) && t===iso(today)) return 'mes';
  if (f===iso(mPrevStart) && t===iso(mPrevEnd)) return 'mesPrev';
  return '';
}

function renderDatePicker(){
  return `<div class="date-picker ${dp.open?'open':''}" id="datePicker">
    <button class="date-picker-btn" id="dpBtn" type="button">
      <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <span class="lbl" id="dpLbl">${esc(dpLabel())}</span>
      <svg class="chev" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="date-picker-popover" id="dpPop">
      <div class="dp-presets" id="dpPresets"></div>
      <div class="dp-cal" id="dpCal"></div>
    </div>
  </div>`;
}

function paintPresets(){
  const active = dpActivePreset();
  const presets = [
    ['hoy','Hoy'],['ayer','Ayer'],['7d','Últimos 7 días'],['30d','Últimos 30 días'],
    ['mes','Este mes'],['mesPrev','Mes pasado'],['clear','Todo']
  ];
  $('#dpPresets').innerHTML = presets.map(([k,l]) =>
    `<button class="dp-preset ${active===k?'active':''}" data-preset="${k}">${l}</button>`
  ).join('');
  $$('#dpPresets .dp-preset').forEach(b => b.addEventListener('click', () => dpApplyPreset(b.dataset.preset)));
}

function paintDpCalendar(){
  const cal = $('#dpCal');
  if (!cal) return;
  const y = dp.viewY, m = dp.viewM;
  const first = new Date(y,m,1);
  const dowFirst = (first.getDay() + 6) % 7; // lunes=0
  const daysInMonth = new Date(y,m+1,0).getDate();
  const daysInPrev  = new Date(y,m,0).getDate();
  const fromT = state.filters.from ? dpFromIso(state.filters.from).getTime() : null;
  const toT   = state.filters.to   ? dpFromIso(state.filters.to).getTime()   : null;
  const todayIso = dpIso(new Date());

  const cells = [];
  for (let i=dowFirst-1;i>=0;i--) cells.push({ y:m===0?y-1:y, m:m===0?11:m-1, d:daysInPrev-i, other:true });
  for (let d=1; d<=daysInMonth; d++) cells.push({ y, m, d, other:false });
  while (cells.length % 7 !== 0){
    const d = cells.length - dowFirst - daysInMonth + 1;
    cells.push({ y:m===11?y+1:y, m:m===11?0:m+1, d, other:true });
  }

  const dayCells = cells.map(c => {
    const iso = `${c.y}-${String(c.m+1).padStart(2,'0')}-${String(c.d).padStart(2,'0')}`;
    const t = new Date(c.y,c.m,c.d).getTime();
    const isStart = fromT && iso === state.filters.from;
    const isEnd   = toT && iso === state.filters.to;
    const inRange = fromT && toT && t > fromT && t < toT;
    const cls = ['dp-day',
      c.other?'other-month':'',
      iso===todayIso?'today':'',
      isStart?'start':'',
      isEnd?'end':'',
      inRange?'in-range':''
    ].filter(Boolean).join(' ');
    return `<div class="${cls}" data-iso="${iso}">${c.d}</div>`;
  }).join('');

  cal.innerHTML = `
    <div class="dp-head">
      <button class="dp-nav" data-nav="-1" type="button">‹</button>
      <div class="dp-title">${DP_MONTHS[m]} ${y}</div>
      <button class="dp-nav" data-nav="1" type="button">›</button>
    </div>
    <div class="dp-grid">
      ${DP_DOW.map(n=>`<div class="dp-dow">${n}</div>`).join('')}
      ${dayCells}
    </div>`;
  $$('#dpCal .dp-day').forEach(el => el.addEventListener('click', () => dpPickDay(el.dataset.iso)));
  $$('#dpCal .dp-nav').forEach(el => el.addEventListener('click', () => {
    const delta = parseInt(el.dataset.nav,10);
    dp.viewM += delta;
    if (dp.viewM < 0){ dp.viewM = 11; dp.viewY--; }
    if (dp.viewM > 11){ dp.viewM = 0; dp.viewY++; }
    paintDpCalendar();
  }));
}

function dpPickDay(iso){
  if (!state.filters.from || (state.filters.from && state.filters.to)){
    state.filters.from = iso;
    state.filters.to = '';
  } else {
    // ya hay from, no hay to
    if (iso < state.filters.from){
      state.filters.to = state.filters.from;
      state.filters.from = iso;
    } else {
      state.filters.to = iso;
    }
  }
  paintDpCalendar();
  paintPresets();
  $('#dpLbl').textContent = dpLabel();
  paintReservationsTable();
}

function dpApplyPreset(preset){
  const today = new Date();
  const iso = d => dpIso(d);
  switch(preset){
    case 'hoy':     state.filters.from = iso(today); state.filters.to = iso(today); break;
    case 'ayer':    { const y=new Date(today); y.setDate(y.getDate()-1); state.filters.from=iso(y); state.filters.to=iso(y); break; }
    case '7d':      { const s=new Date(today); s.setDate(s.getDate()-6); state.filters.from=iso(s); state.filters.to=iso(today); break; }
    case '30d':     { const s=new Date(today); s.setDate(s.getDate()-29); state.filters.from=iso(s); state.filters.to=iso(today); break; }
    case 'mes':     { const s=new Date(today.getFullYear(),today.getMonth(),1); state.filters.from=iso(s); state.filters.to=iso(today); break; }
    case 'mesPrev': { const s=new Date(today.getFullYear(),today.getMonth()-1,1); const e=new Date(today.getFullYear(),today.getMonth(),0); state.filters.from=iso(s); state.filters.to=iso(e); dp.viewY=s.getFullYear(); dp.viewM=s.getMonth(); break; }
    case 'clear':   state.filters.from=''; state.filters.to=''; break;
  }
  if (state.filters.from){ const d = dpFromIso(state.filters.from); dp.viewY=d.getFullYear(); dp.viewM=d.getMonth(); }
  paintDpCalendar();
  paintPresets();
  $('#dpLbl').textContent = dpLabel();
  paintReservationsTable();
}

function wireDatePicker(){
  const wrap = $('#datePicker');
  if (!wrap) return;
  // Vista inicial: mes del "from" o mes actual
  if (state.filters.from){ const d = dpFromIso(state.filters.from); dp.viewY=d.getFullYear(); dp.viewM=d.getMonth(); }
  paintPresets();
  paintDpCalendar();
  $('#dpBtn').addEventListener('click', e => {
    e.stopPropagation();
    dp.open = !dp.open;
    wrap.classList.toggle('open', dp.open);
  });
  // Click fuera → cerrar
  document.addEventListener('click', function onOut(e){
    if (!wrap.contains(e.target) && dp.open){
      dp.open = false;
      wrap.classList.remove('open');
    }
  });
}

// Bloque destacado para "N botellas (1 × X + 2 × Y)" o "N mezclas: A + B"
// o "2 (14€)" — cachimbas. Lo hace visual y rápido de leer en un vistazo,
// con cada item en su propia línea.
function fmtOrder(label, raw, color='pink'){
  if (!raw) return '';
  const str = String(raw).trim();
  // Patrón: "N unidad (...)" | "N unidad: ..." | "N (14€)" | "Ninguna" | libre
  const m = str.match(/^(\d+)\s*(botellas?|mezclas?|cachimbas?)?\s*[:\(]?\s*([^\[\]]*?)\)?\s*(\[.+\])?\s*$/i);
  let count = '', unit = label.toUpperCase(), body = str, extra = '';
  if (m){
    count = m[1] || '';
    if (m[2]) unit = m[2].toUpperCase();
    body  = (m[3] || '').trim();
    extra = m[4] ? m[4].replace(/^\[|\]$/g,'').trim() : '';
  }
  if (!count){
    return `<div class="kv-item kv-full"><span class="k">${esc(label)}</span>
      <div class="detail-block ${color}"><div class="db-body">${esc(str)}</div></div></div>`;
  }
  // Parte cada "1 × Ron Barceló + 2 × Belaire Rosé" en items independientes
  const items = body
    ? body.split(/\s*\+\s*/).map(part => {
        const p = part.trim();
        if (!p) return '';
        const im = p.match(/^(\d+)\s*[×x]\s*(.+)$/i);
        if (im) return `<div class="db-item"><b>${im[1]}×</b> <span>${esc(im[2].trim())}</span></div>`;
        return `<div class="db-item"><span>${esc(p)}</span></div>`;
      }).filter(Boolean).join('')
    : '';
  return `<div class="kv-item kv-full">
    <span class="k">${esc(label)}</span>
    <div class="detail-block ${color}">
      <div class="db-count">${count} ${esc(unit)}${items?':':''}</div>
      ${items ? `<div class="db-list">${items}</div>` : ''}
      ${extra ? `<div class="db-extra">+ ${esc(extra)}</div>` : ''}
    </div>
  </div>`;
}

function renderStats(){
  const period = state.statsPeriod || '30d';
  const now = new Date();
  let daysBack, bucketDays;
  if (period === '7d')      { daysBack = 7;   bucketDays = 1;  }
  else if (period === '30d'){ daysBack = 30;  bucketDays = 1;  }
  else if (period === '12m'){ daysBack = 365; bucketDays = 30; }
  else                      { daysBack = 30;  bucketDays = 1;  }

  // Rango actual
  const rangeEnd   = endOfDay(now).getTime();
  const rangeStart = startOfDay(new Date(now.getTime() - (daysBack - 1) * 86400000)).getTime();
  // Rango previo (para comparar)
  const prevEnd   = rangeStart - 1;
  const prevStart = new Date(rangeStart - daysBack * 86400000).getTime();

  const current = state.reservations.filter(r => {
    const t = new Date(r.created_at).getTime();
    return t >= rangeStart && t <= rangeEnd;
  });
  const previous = state.reservations.filter(r => {
    const t = new Date(r.created_at).getTime();
    return t >= prevStart && t <= prevEnd;
  });

  const currentCount = current.length;
  const prevCount = previous.length;
  const delta = prevCount ? ((currentCount - prevCount) / prevCount) * 100 : (currentCount ? 100 : 0);
  const confirmed = current.filter(r => r.status === 'confirmada' || r.status === 'realizada').length;
  const confRate = currentCount ? (confirmed / currentCount * 100) : 0;
  const avgPerDay = currentCount / (daysBack / bucketDays);
  const totalPeople = current.reduce((s, r) => s + (parseInt(r.people, 10) || 0), 0);
  const avgPeople = currentCount ? totalPeople / currentCount : 0;

  $('#mainView').innerHTML = `
    <div class="stats-view">
      <div class="view-title">
        <div>
          <h1>Estadísticas <em>del Shaona</em></h1>
          <div class="subtitle">Evolución de reservas y patrones. Últimos ${daysBack} días.</div>
        </div>
        <button class="btn ghost sm" id="refreshBtn">${ICONS.refresh} Recargar</button>
      </div>

      <div class="period-chips">
        <button class="period-chip ${period==='7d'?'active':''}" data-period="7d">Última semana</button>
        <button class="period-chip ${period==='30d'?'active':''}" data-period="30d">Último mes</button>
        <button class="period-chip ${period==='12m'?'active':''}" data-period="12m">Último año</button>
      </div>

      <div class="kpi-grid">
        <div class="kpi">
          <div class="kpi-label">Reservas totales</div>
          <div class="kpi-value pink">${currentCount}</div>
          <div class="kpi-delta ${delta>0?'up':delta<0?'down':'flat'}">${delta>0?'▲':delta<0?'▼':'•'} ${Math.abs(delta).toFixed(0)}%</div>
          <div class="kpi-foot">vs periodo anterior (${prevCount})</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Confirmadas</div>
          <div class="kpi-value green">${confirmed}</div>
          <div class="kpi-foot">${confRate.toFixed(0)}% del total</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Media diaria</div>
          <div class="kpi-value cyan">${avgPerDay.toFixed(1)}</div>
          <div class="kpi-foot">reservas por día</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Personas promedio</div>
          <div class="kpi-value gold">${avgPeople.toFixed(1)}</div>
          <div class="kpi-foot">por reserva</div>
        </div>
      </div>

      <div class="chart-card">
        <h3>Evolución de reservas</h3>
        <div class="chart-sub">Reservas por ${bucketDays===1?'día':'mes'} · últimos ${daysBack} días</div>
        <div id="barChart"></div>
      </div>

      <div class="chart-grid-2">
        <div class="chart-card">
          <h3>Por tipo de reserva</h3>
          <div class="chart-sub">Distribución por tipo</div>
          <div class="type-breakdown" id="typeBreakdown"></div>
        </div>
        <div class="chart-card">
          <h3>Top eventos</h3>
          <div class="chart-sub">Los más solicitados en el periodo</div>
          <div class="top-events" id="topEvents"></div>
        </div>
      </div>
    </div>
  `;

  paintBarChart(current, rangeStart, rangeEnd, daysBack, bucketDays);
  paintTypeBreakdown(current);
  paintTopEvents(current);

  $$('.period-chip').forEach(c => c.addEventListener('click', () => {
    state.statsPeriod = c.dataset.period;
    renderStats();
  }));
  $('#refreshBtn').addEventListener('click', async () => {
    await ensureData(true); routeToView(); toast('Datos recargados','','success',1500);
  });
}

function paintBarChart(items, rangeStart, rangeEnd, daysBack, bucketDays){
  const el = $('#barChart');
  if (!el) return;
  // Agrupar por bucket
  const bucketCount = Math.ceil(daysBack / bucketDays);
  const buckets = Array.from({length:bucketCount}, () => ({ count:0, label:'' }));
  for (const r of items){
    const t = new Date(r.created_at).getTime();
    const dayOffset = Math.floor((t - rangeStart) / 86400000);
    const idx = Math.floor(dayOffset / bucketDays);
    if (idx >= 0 && idx < bucketCount) buckets[idx].count++;
  }
  // Labels
  for (let i=0; i<bucketCount; i++){
    const bStart = new Date(rangeStart + i*bucketDays*86400000);
    if (bucketDays === 1){
      buckets[i].label = bStart.toLocaleDateString('es-ES',{day:'2-digit',month:'short'});
    } else {
      buckets[i].label = bStart.toLocaleDateString('es-ES',{month:'short'});
    }
  }
  const maxVal = Math.max(...buckets.map(b => b.count), 1);
  const W = 800, H = 260, padL = 30, padR = 10, padT = 20, padB = 40;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;
  const barGap = 3;
  const barW = Math.max((chartW / bucketCount) - barGap, 2);

  // Grid lines (5 líneas)
  const gridLines = [0, 0.25, 0.5, 0.75, 1].map(f => {
    const y = padT + chartH - (chartH * f);
    const val = Math.round(maxVal * f);
    return `<line class="chart-grid" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"/><text class="chart-axis" x="${padL - 6}" y="${y+3}" text-anchor="end">${val}</text>`;
  }).join('');

  // Bars
  const bars = buckets.map((b, i) => {
    const h = (b.count / maxVal) * chartH;
    const x = padL + i * (barW + barGap);
    const y = padT + chartH - h;
    return `<rect class="chart-bar" x="${x}" y="${y}" width="${barW}" height="${h}" rx="2" fill="url(#barGrad)"><title>${b.label}: ${b.count}</title></rect>`;
  }).join('');

  // Labels (solo cada N buckets si son muchos)
  const step = Math.ceil(bucketCount / 10);
  const labels = buckets.map((b, i) => {
    if (i % step !== 0) return '';
    const x = padL + i * (barW + barGap) + barW/2;
    return `<text class="chart-axis" x="${x}" y="${H - padB + 16}" text-anchor="middle">${b.label}</text>`;
  }).join('');

  el.innerHTML = `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    <defs>
      <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ff0066"/>
        <stop offset="100%" stop-color="#7a0030"/>
      </linearGradient>
    </defs>
    ${gridLines}
    ${bars}
    ${labels}
  </svg>`;
}

function paintTypeBreakdown(items){
  const el = $('#typeBreakdown');
  if (!el) return;
  const types = ['reservado','evento','cumpleanos','mesa'];
  const labels = { reservado:'Reservados', evento:'Eventos', cumpleanos:'Cumpleaños', mesa:'Mesas' };
  const colors = { reservado:'var(--pink)', evento:'var(--cyan)', cumpleanos:'var(--gold)', mesa:'var(--muted)' };
  const total = items.length || 1;
  const rows = types.map(t => {
    const count = items.filter(r => r.type === t).length;
    const pct = (count / total) * 100;
    return `<div class="type-row">
      <div class="type-name">${labels[t]}</div>
      <div class="type-bar"><div class="type-bar-fill" style="width:${pct}%;background:${colors[t]}"></div></div>
      <div class="type-count">${count}</div>
    </div>`;
  }).join('');
  el.innerHTML = rows || `<div class="empty" style="padding:20px 0"><p>Sin datos en el periodo</p></div>`;
}

function paintTopEvents(items){
  const el = $('#topEvents');
  if (!el) return;
  const counts = new Map();
  for (const r of items){
    const name = (r.event_name || '').trim();
    if (!name) continue;
    counts.set(name, (counts.get(name) || 0) + 1);
  }
  const top = [...counts.entries()].sort((a,b) => b[1] - a[1]).slice(0, 5);
  if (!top.length){
    el.innerHTML = `<div class="empty" style="padding:20px 0"><p>Sin eventos identificados</p></div>`;
    return;
  }
  el.innerHTML = top.map(([name, count], i) => `
    <div class="top-event">
      <div class="rank">${i+1}º</div>
      <div class="name">${esc(name)}</div>
      <div class="count">${count}</div>
    </div>`).join('');
}

function renderTorneo(){
  const podium = state.currentEventId ? topPodium(state.currentEventId) : [];
  const full   = state.currentEventId ? bestPerPlayer(state.currentEventId) : [];
  const filtered = state.currentEventId ? state.scores.filter(s => s.event_id === state.currentEventId) : [];
  const totalGames = filtered.length;
  const uniquePlayers = new Set(filtered.map(s => s.phone)).size;

  $('#mainView').innerHTML = `
    <div class="view-title">
      <div>
        <h1>Torneo <em>Pink Runner</em></h1>
        <div class="subtitle">${state.events.length} evento${state.events.length===1?'':'s'} con partidas · Ranking = mejor puntuación por jugador</div>
      </div>
      <div class="flex gap-8">
        <button class="btn ghost sm" id="refreshBtn">${ICONS.refresh} Recargar</button>
        ${state.currentEventId?`<button class="btn ghost sm" id="exportBtn">${ICONS.download} Exportar CSV</button>`:''}
      </div>
    </div>

    ${state.events.length ? `
      <div class="chips" id="eventChips">
        ${state.events.map(id => `<div class="chip ${id===state.currentEventId?'active':''}" data-event="${esc(id)}">${esc(id)} <span class="count">${state.scores.filter(s=>s.event_id===id).length}</span></div>`).join('')}
      </div>
    ` : ''}

    ${state.currentEventId ? `
      <div class="stats-grid">
        <div class="stat">
          <div class="label">Jugadores únicos <span class="icon-bg">${ICONS.users}</span></div>
          <div class="value pink">${uniquePlayers}</div>
        </div>
        <div class="stat">
          <div class="label">Partidas totales <span class="icon-bg">${ICONS.bar}</span></div>
          <div class="value">${totalGames}</div>
        </div>
        <div class="stat">
          <div class="label">Top score <span class="icon-bg">${ICONS.crown}</span></div>
          <div class="value cyan">${full[0]?.score || 0}</div>
        </div>
        <div class="stat">
          <div class="label">Premios entregados <span class="icon-bg">${ICONS.gift}</span></div>
          <div class="value green">${podium.filter(p => p.prize_delivered_at).length}<small style="font-size:.85rem;color:var(--muted);font-family:Outfit,sans-serif;font-weight:500"> / ${podium.length}</small></div>
        </div>
      </div>

      <div class="section-h">
        <h2>El <em>podio</em></h2>
        <span class="side">Los tres mejores del evento</span>
      </div>
      ${renderPodium(podium, true)}

      <div class="section-h">
        <h2>Ranking <em>completo</em></h2>
        <span class="side">${full.length} jugador${full.length===1?'':'es'}</span>
      </div>
      <div class="table-card" id="rankTable"></div>

      <div class="section-h">
        <h2>Zona <em>peligrosa</em></h2>
      </div>
      <div class="card" style="border-color:rgba(255,85,119,.3)">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
          <div>
            <div style="font-weight:600;margin-bottom:4px">Borrar puntuaciones del evento</div>
            <div style="font-size:.83rem;color:var(--muted)">Borra todas las partidas de <strong>${esc(state.currentEventId)}</strong>. Los datos no se pueden recuperar.</div>
          </div>
          <button class="btn ghost danger" id="clearBtn">${ICONS.trash} Borrar evento</button>
        </div>
      </div>
    ` : `
      <div class="table-card"><div class="empty"><div class="icon">${ICONS.trophy}</div><h3>No hay partidas todavía</h3><p>Cuando alguien juegue en <code>juego.html</code>, el ranking aparecerá aquí.</p></div></div>
    `}
  `;

  $$('.chip[data-event]').forEach(c => c.addEventListener('click', () => {
    state.currentEventId = c.dataset.event;
    renderTorneo();
  }));
  $('#refreshBtn').addEventListener('click', async () => {
    await ensureData(true); routeToView(); toast('Datos recargados','','success',1500);
  });
  const exp = $('#exportBtn');
  if (exp) exp.addEventListener('click', () => {
    const list = bestPerPlayer(state.currentEventId).map((r,i) => ({
      position: i+1, name: r.name, phone: r.phone, score: r.score,
      last_played: r.created_at, prize_delivered_at: r.prize_delivered_at || ''
    }));
    exportCSV(list, ['position','name','phone','score','last_played','prize_delivered_at'], `torneo-${state.currentEventId}`);
  });
  const clr = $('#clearBtn');
  if (clr) clr.addEventListener('click', () => {
    confirmModal({
      title:'Borrar puntuaciones del evento', danger:true,
      message:`Vas a borrar TODAS las partidas del evento <strong>${esc(state.currentEventId)}</strong>. Esta acción no se puede deshacer.`,
      confirmLabel:'Sí, borrar todo',
      onConfirm: async () => {
        const eid = state.currentEventId;
        const { error } = await supa.from('tournament_scores').delete().eq('event_id', eid);
        if (error) return toast('Error', error.message, 'error');
        state.scores = state.scores.filter(s => s.event_id !== eid);
        state.events = state.events.filter(id => id !== eid);
        state.currentEventId = state.events[0] || null;
        toast('Evento borrado','','success');
        renderTorneo();
      }
    });
  });

  if (state.currentEventId) paintRankTable(full);
}

function paintRankTable(list){
  const el = $('#rankTable');
  if (!list.length){
    el.innerHTML = `<div class="empty"><div class="icon">${ICONS.empty}</div><h3>Sin partidas</h3></div>`;
    return;
  }
  el.innerHTML = `
    <table class="tbl">
      <thead><tr>
        <th>Pos.</th><th>Jugador</th><th>Teléfono</th><th>Puntuación</th><th class="hide-sm">Última partida</th><th></th>
      </tr></thead>
      <tbody>
        ${list.map((r,i) => `
          <tr>
            <td data-label="Posición"><strong style="font-family:'Outfit',sans-serif;font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums;color:${i===0?'var(--gold)':i===1?'var(--silver)':i===2?'var(--bronze)':'var(--text)'}">${i+1}º</strong></td>
            <td class="name-cell" data-label="Jugador"><strong>${esc(r.name)}</strong>${r.prize_delivered_at?`<small style="color:var(--green)">✓ premio entregado</small>`:''}</td>
            <td data-label="Teléfono"><a href="tel:${esc(r.phone)}" style="color:var(--cyan)">${esc(r.phone)}</a></td>
            <td class="num" data-label="Puntuación" style="color:var(--cyan);font-size:1.05rem">${r.score}</td>
            <td class="hide-sm muted" data-label="Última partida">${fmtDateTime(r.created_at)}</td>
            <td class="actions" data-label="Acciones">
              <a class="btn icon-only ghost" href="${waLink(r.phone)}" target="_blank" rel="noopener" title="WhatsApp">${ICONS.phone}</a>
              ${i<3?`<button class="btn icon-only ${r.prize_delivered_at?'':'ghost'}" data-prize="${r.id}" title="${r.prize_delivered_at?'Marcar como no entregado':'Marcar premio entregado'}">${r.prize_delivered_at?ICONS.check:ICONS.gift}</button>`:''}
            </td>
          </tr>`).join('')}
      </tbody>
    </table>`;
  $$('button[data-prize]', el).forEach(btn => btn.addEventListener('click', () => togglePrize(btn.dataset.prize)));
}

async function togglePrize(scoreId){
  const s = state.scores.find(x => x.id === scoreId);
  if (!s) return;
  const newVal = s.prize_delivered_at ? null : new Date().toISOString();
  const { error } = await supa.from('tournament_scores')
    .update({ prize_delivered_at: newVal })
    .eq('id', scoreId);
  if (error) return toast('Error', error.message, 'error');
  s.prize_delivered_at = newVal;
  toast(newVal ? 'Premio marcado como entregado' : 'Premio desmarcado','','success', 2000);
  renderTorneo();
}

function bestPerPlayer(eventId){
  const filtered = state.scores.filter(s => s.event_id === eventId);
  const best = new Map();
  for (const r of filtered){
    const cur = best.get(r.phone);
    if (!cur || r.score > cur.score) best.set(r.phone, r);
  }
  return [...best.values()].sort((a,b) => b.score - a.score);
}
function topPodium(eventId){ return bestPerPlayer(eventId).slice(0,3); }

function renderPodium(podium, showActions=false){
  const rewards = [
    '65% descuento reservado + camiseta',
    '5 copas gratis + pegatinas',
    '3 copas gratis + pegatinas'
  ];
  const cells = [1,0,2].map(i => {  // orden visual: 2º, 1º, 3º
    const p = podium[i];
    const cls = i === 0 ? 'p1' : i === 1 ? 'p2' : 'p3';
    const medal = ['🥇','🥈','🥉'][i];
    if (!p){
      return `<div class="step ${cls} empty-slot">
        <div class="medal">${medal}</div>
        <div class="pos">${i+1}º</div>
        <div class="name">Sin jugador</div>
        <div class="prize">${rewards[i]}</div>
      </div>`;
    }
    return `<div class="step ${cls}">
      <div class="medal">${medal}</div>
      <div class="pos">${i+1}º</div>
      <div class="name">${esc(p.name)}</div>
      <div class="phone">${esc(p.phone)}</div>
      <div class="score">${p.score} pts</div>
      <div class="prize">${rewards[i]}</div>
      ${showActions ? `
        <div class="flex gap-6" style="justify-content:center">
          <a class="btn sm ghost" href="${waLink(p.phone)}" target="_blank" rel="noopener">${ICONS.phone} WhatsApp</a>
          <button class="btn sm ${p.prize_delivered_at?'primary':'ghost'}" onclick="window.__togglePrize('${p.id}')">${p.prize_delivered_at?ICONS.check+' Entregado':ICONS.gift+' Marcar'}</button>
        </div>` : ''}
      ${p.prize_delivered_at ? `<div class="delivered-badge">${ICONS.check} Entregado</div>` : ''}
    </div>`;
  });
  return `<div class="podium">${cells.join('')}</div>`;
}
window.__togglePrize = togglePrize;

/* ============================================================
   CSV Export
   ============================================================ */
function exportCSV(list, cols, base){
  const csv = [cols.join(',')].concat(
    list.map(r => cols.map(c => csvCell(r[c])).join(','))
  ).join('\n');
  const blob = new Blob(['﻿' + csv], { type:'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${base}-${isoDate(new Date())}.csv`;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 0);
  toast('Descargando CSV', `${list.length} filas`, 'success', 2500);
}
function csvCell(v){
  if (v == null) return '';
  const s = String(v).replace(/"/g,'""');
  return /[",\n]/.test(s) ? `"${s}"` : s;
}

// ---------- Boot ----------
boot();
</script>
