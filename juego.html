<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Torneo Shaona — Juega y Gana</title>
<meta name="description" content="Torneo del Shaona Hookah Lounge. Juega al mini-juego del evento, sube en el ranking y llévate premios.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08060a;
  --bg-2:#15000d;
  --pink:#ff0066;
  --pink-soft:#ff66aa;
  --cyan:#00e0ff;
  --text:#fff;
  --muted:#888;
  --border:rgba(255,255,255,.08);
}
html,body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit}

.topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 32px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(8,6,10,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:50}
.logo{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:600;letter-spacing:1px}
.logo em{color:var(--pink);font-style:normal}
.back-link{font-size:.74rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);transition:color .2s}
.back-link:hover{color:var(--pink)}

.hero{padding:60px 24px 30px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;top:-40%;left:50%;transform:translateX(-50%);width:900px;height:600px;background:radial-gradient(circle,rgba(255,0,102,.16) 0%,transparent 60%);pointer-events:none}
.event-pill{display:inline-block;font-size:.7rem;letter-spacing:3px;text-transform:uppercase;color:var(--cyan);padding:6px 16px;border:1px solid var(--cyan);border-radius:999px;margin-bottom:22px;position:relative}
.hero h1{font-family:'Cormorant Garamond',serif;font-size:clamp(2.4rem,6vw,4.2rem);font-weight:600;line-height:1.05;margin-bottom:16px;position:relative}
.hero h1 em{color:var(--pink);font-style:italic}
.hero p.lead{color:var(--muted);font-size:1rem;max-width:560px;margin:0 auto;line-height:1.6;position:relative}

.rewards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:820px;margin:40px auto 0;padding:0 16px;position:relative}
.reward{background:linear-gradient(160deg,rgba(255,255,255,.04),rgba(0,0,0,.4));border:1px solid var(--border);padding:24px 18px;text-align:center;position:relative;overflow:hidden;transition:transform .3s ease}
.reward:hover{transform:translateY(-4px)}
.reward .place{font-family:'Cormorant Garamond',serif;font-size:2.8rem;font-weight:700;line-height:1;margin-bottom:10px}
.reward .place sup{font-size:.45em;vertical-align:super;font-weight:500;opacity:.6}
.reward-prize{font-size:.95rem;font-weight:500;line-height:1.45;margin-bottom:6px}
.reward-extra{font-size:.78rem;color:var(--muted);margin-top:8px;font-style:italic}
.reward.gold{background:linear-gradient(160deg,rgba(255,200,40,.14),rgba(0,0,0,.5));border-color:rgba(255,200,40,.3)}
.reward.gold .place{color:#ffc828}
.reward.silver{background:linear-gradient(160deg,rgba(200,200,220,.1),rgba(0,0,0,.5));border-color:rgba(200,200,220,.25)}
.reward.silver .place{color:#dcdcef}
.reward.bronze{background:linear-gradient(160deg,rgba(255,126,58,.12),rgba(0,0,0,.5));border-color:rgba(255,126,58,.3)}
.reward.bronze .place{color:#ff7e3a}

.participation-note{max-width:820px;margin:18px auto 0;padding:0 16px;text-align:center;color:var(--cyan);font-size:.78rem;letter-spacing:2px;text-transform:uppercase}

.form-section{max-width:520px;margin:50px auto;padding:0 24px}
.form-card{background:linear-gradient(160deg,var(--bg-2),rgba(0,0,0,.6));border:1px solid var(--border);padding:36px 28px}
.form-card h2{font-family:'Cormorant Garamond',serif;font-size:1.8rem;margin-bottom:6px}
.form-card .sub{color:var(--muted);font-size:.88rem;margin-bottom:24px}
.form-row{margin-bottom:18px}
.form-row label{display:block;font-size:.7rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.form-row input{width:100%;background:rgba(0,0,0,.4);border:1px solid var(--border);color:var(--text);padding:14px 16px;font-size:.95rem;font-family:inherit;transition:border-color .2s;border-radius:0}
.form-row input:focus{outline:none;border-color:var(--pink)}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:.78rem;color:var(--muted);line-height:1.5;margin:18px 0 24px;cursor:pointer}
.consent input{margin-top:3px;accent-color:var(--pink);flex-shrink:0}
.consent a{color:var(--cyan);text-decoration:underline}
.btn{display:block;width:100%;background:var(--pink);color:#fff;border:none;padding:16px;font-size:.82rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .2s}
.btn:hover{background:#cc0044;transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.error{color:#ff5577;font-size:.82rem;margin-top:10px;min-height:1.2em}

.game-section{max-width:940px;margin:40px auto;padding:0 16px}
.game-wrap{position:relative;background:#0c0008;border:1px solid var(--border);overflow:hidden;border-radius:4px;box-shadow:0 30px 80px -30px rgba(255,0,102,.4)}
canvas{display:block;width:100%;height:auto;background:transparent;touch-action:manipulation}
.hud{position:absolute;top:14px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none;font-family:'Outfit',sans-serif;font-weight:700;letter-spacing:2px}
.hud .score{color:var(--cyan);font-size:1.2rem;text-shadow:0 0 12px rgba(0,224,255,.5)}
.hud .player-name{color:var(--text);font-size:.82rem;opacity:.7;text-transform:uppercase}
.sound-toggle{background:rgba(0,0,0,.4);backdrop-filter:blur(6px);border:1px solid var(--border);color:var(--text);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:.95rem;display:grid;place-items:center;pointer-events:auto;transition:all .15s ease}
.sound-toggle:hover{border-color:var(--pink);transform:scale(1.05)}
.sound-toggle .sound-off{display:none}
.sound-toggle.muted .sound-on{display:none}
.sound-toggle.muted .sound-off{display:block;opacity:.5}
.game-overlay{position:absolute;inset:0;background:rgba(0,0,0,.86);backdrop-filter:blur(4px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;z-index:5}
.game-overlay h3{font-family:'Cormorant Garamond',serif;font-size:2.2rem;margin-bottom:12px;line-height:1.1}
.game-overlay h3 em{color:var(--pink);font-style:italic}
.game-overlay p{color:var(--muted);margin-bottom:20px;font-size:.9rem;max-width:380px;line-height:1.5}
.game-overlay .big-score{font-family:'Cormorant Garamond',serif;font-size:4.6rem;color:var(--pink);font-weight:700;line-height:1;margin:10px 0 14px;text-shadow:0 0 30px rgba(255,0,102,.5)}
.game-overlay button{background:var(--pink);color:#fff;border:none;padding:14px 32px;font-size:.82rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;font-family:inherit;margin-top:6px;transition:all .2s}
.game-overlay button:hover{background:#cc0044;transform:translateY(-1px)}
.hidden{display:none !important}
.controls-tip{font-size:.74rem;color:var(--muted);margin-top:14px;letter-spacing:1px}

.ranking-section{max-width:680px;margin:60px auto;padding:0 24px}
.ranking-section h2{font-family:'Cormorant Garamond',serif;font-size:2.2rem;text-align:center;margin-bottom:8px}
.ranking-section h2 em{color:var(--pink);font-style:italic}
.ranking-section .sub-h{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:26px}
.ranking-list{background:linear-gradient(160deg,var(--bg-2),rgba(0,0,0,.5));border:1px solid var(--border);padding:6px}
.rank-row{display:grid;grid-template-columns:54px 1fr auto;align-items:center;padding:16px 22px;border-bottom:1px solid var(--border);gap:12px;transition:background .2s}
.rank-row:last-child{border-bottom:none}
.rank-row:hover{background:rgba(255,0,102,.04)}
.rank-row .pos{font-family:'Cormorant Garamond',serif;font-size:1.5rem;color:var(--muted);font-weight:600;text-align:center}
.rank-row.top1{background:linear-gradient(90deg,rgba(255,200,40,.08),transparent 70%)}
.rank-row.top1 .pos{color:#ffc828;font-size:1.9rem}
.rank-row.top2{background:linear-gradient(90deg,rgba(200,200,220,.06),transparent 70%)}
.rank-row.top2 .pos{color:#dcdcef;font-size:1.7rem}
.rank-row.top3{background:linear-gradient(90deg,rgba(255,126,58,.07),transparent 70%)}
.rank-row.top3 .pos{color:#ff7e3a;font-size:1.7rem}
.rank-row .name{font-size:.98rem;font-weight:500;text-transform:uppercase;letter-spacing:1.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-row.is-me{box-shadow:inset 3px 0 0 var(--pink)}
.rank-row.is-me .name{color:var(--pink)}
.rank-row .score{color:var(--cyan);font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums}
.rank-empty{padding:32px;text-align:center;color:var(--muted);font-size:.9rem}

.closed-card{max-width:540px;margin:60px auto;padding:0 24px}
.closed-inner{background:linear-gradient(160deg,var(--bg-2),rgba(0,0,0,.6));border:1px solid var(--border);padding:48px 32px;text-align:center}
.closed-inner h2{font-family:'Cormorant Garamond',serif;font-size:2rem;margin-bottom:14px}
.closed-inner p{color:var(--muted);font-size:.95rem;line-height:1.6;margin-bottom:24px}
.closed-inner .alert{display:inline-block;color:var(--pink);font-size:.7rem;letter-spacing:3px;text-transform:uppercase;padding:6px 16px;border:1px solid var(--pink);border-radius:999px;margin-bottom:22px}

.rules{max-width:680px;margin:50px auto 30px;padding:0 24px;color:var(--muted);font-size:.78rem;line-height:1.7}
.rules h3{font-family:'Cormorant Garamond',serif;font-size:1.2rem;color:var(--text);margin-bottom:10px}
.rules ul{padding-left:18px}

footer{padding:36px 24px;text-align:center;color:var(--muted);font-size:.74rem;border-top:1px solid var(--border);margin-top:40px}

@media (max-width:640px){
  .topbar{padding:14px 20px}
  .logo{font-size:1.2rem}
  .hero{padding:40px 20px 24px}
  .rewards{grid-template-columns:1fr;gap:10px}
  .reward{padding:18px}
  .reward .place{font-size:2.2rem}
  .game-section{padding:0 10px}
  .game-overlay h3{font-size:1.6rem}
  .game-overlay .big-score{font-size:3.4rem}
  .rank-row{grid-template-columns:40px 1fr auto;padding:14px;gap:10px}
  .rank-row .pos{font-size:1.1rem}
  .rank-row.top1 .pos,.rank-row.top2 .pos,.rank-row.top3 .pos{font-size:1.4rem}
}
</style>
</head>
<body>

<header class="topbar">
  <a href="index.html" class="logo">Shaona<em>.</em></a>
  <a href="index.html" class="back-link">← Volver al inicio</a>
</header>

<!-- ===========================================================
     CONFIG: edita esto en CADA evento nuevo
     =========================================================== -->
<script>
window.SHAONA_TOURNAMENT = {
  // ID único por evento — cámbialo siempre que arranques un torneo nuevo,
  // así los rankings de eventos pasados no se mezclan.
  eventId: 'matinee-2025-04',
  eventName: 'Matinée Shaona',
  eventDate: 'Sáb 27 Abr · 12:00',

  // false = torneo cerrado. La página muestra el mensaje de "vuelve pronto".
  active: true,

  // Texto libre por cada premio. Cámbialos cuando quieras.
  rewards: [
    { place: 1, prize: '65% de descuento en un reservado', extra: '+ camiseta Shaona' },
    { place: 2, prize: '5 copas gratis',                    extra: '+ pack de pegatinas' },
    { place: 3, prize: '3 copas gratis',                    extra: '+ pack de pegatinas' }
  ],
  // Premio sólo por participar (o null para desactivarlo)
  participationPrize: 'Todos los jugadores se llevan una pegatina del Shaona al recoger el premio en barra.'
};
</script>
<script src="shaona-config.js"></script>

<main id="main"></main>

<footer>
  <p>© Shaona Hookah Lounge · Promoción privada para clientes del local. Premios canjeables únicamente en Shaona y bajo presentación de DNI. Sorteo y entrega bajo responsabilidad de Shaona.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script>
/* ============================================================
   TORNEO SHAONA — Pink Runner
   ============================================================ */
const cfg = window.SHAONA_TOURNAMENT;
const sb  = window.SHAONA_CONFIG || {};
const main = document.getElementById('main');
let supa = null;
if (window.supabase && sb.supabaseUrl && sb.supabaseAnonKey) {
  supa = window.supabase.createClient(sb.supabaseUrl, sb.supabaseAnonKey);
}

const PLAYER_KEY = 'shaona_player_' + cfg.eventId;
const getPlayer = () => { try { return JSON.parse(localStorage.getItem(PLAYER_KEY)); } catch(e){ return null; } };
const setPlayer = p => localStorage.setItem(PLAYER_KEY, JSON.stringify(p));
const clearPlayer = () => localStorage.removeItem(PLAYER_KEY);

function render(){
  if (!cfg.active) {
    main.innerHTML = closedView() + rulesView();
    loadRanking();
    return;
  }
  const player = getPlayer();
  main.innerHTML = `
    ${heroView()}
    ${rewardsView()}
    ${player ? gameView(player) : formView()}
    ${rankingSection()}
    ${rulesView()}
  `;
  if (player) initGame(player);
  loadRanking();
}

function heroView(){
  return `
    <section class="hero">
      <span class="event-pill">${escapeHtml(cfg.eventName)} · ${escapeHtml(cfg.eventDate)}</span>
      <h1>Pink <em>Runner</em></h1>
      <p class="lead">Atrapa diamantes, esquiva botellas. Los <strong style="color:#fff">3 mejores</strong> se llevan premio el día del evento. Cuantas más partidas, mejor — sólo cuenta tu mejor puntuación.</p>
    </section>`;
}

function rewardsView(){
  const cls = ['gold','silver','bronze'];
  const rewards = cfg.rewards.map((r,i)=>`
    <div class="reward ${cls[i]||''}">
      <div class="place">${r.place}<sup>º</sup></div>
      <div class="reward-prize">${escapeHtml(r.prize)}</div>
      ${r.extra ? `<div class="reward-extra">${escapeHtml(r.extra)}</div>` : ''}
    </div>`).join('');
  const note = cfg.participationPrize
    ? `<p class="participation-note">★ ${escapeHtml(cfg.participationPrize)}</p>` : '';
  return `<div class="rewards">${rewards}</div>${note}`;
}

function formView(){
  return `
    <section class="form-section">
      <div class="form-card">
        <h2>Antes de jugar</h2>
        <p class="sub">Sólo dos datos. Si quedas top 3, te llamamos al móvil para recoger tu premio en el local.</p>
        <form id="playerForm" autocomplete="on">
          <div class="form-row">
            <label for="name">Nombre o nick</label>
            <input type="text" id="name" maxlength="20" autocomplete="nickname" required>
          </div>
          <div class="form-row">
            <label for="phone">Teléfono móvil</label>
            <input type="tel" id="phone" inputmode="tel" autocomplete="tel" placeholder="6XX XXX XXX" required>
          </div>
          <label class="consent">
            <input type="checkbox" id="consent" required>
            <span>Acepto que el Shaona conserve mi nombre y teléfono únicamente para contactarme si gano un premio en este torneo. Los datos se eliminarán al cierre del evento.</span>
          </label>
          <button class="btn" type="submit">Empezar a jugar →</button>
          <p class="error" id="formError"></p>
        </form>
      </div>
    </section>`;
}

function gameView(player){
  return `
    <section class="game-section">
      <div class="game-wrap">
        <canvas id="game" width="900" height="320"></canvas>
        <div class="hud">
          <div class="player-name">${escapeHtml(player.name)}</div>
          <div style="display:flex;align-items:center;gap:12px">
            <button class="sound-toggle" id="soundToggle" aria-label="Sonido" title="Activar/desactivar sonido">
              <span class="sound-on">🔊</span>
              <span class="sound-off">🔇</span>
            </button>
            <div class="score" id="hudScore">0</div>
          </div>
        </div>
        <div class="game-overlay" id="startOverlay">
          <h3>¿Listo, <em>${escapeHtml(player.name)}</em>?</h3>
          <p>Salta con <strong>Espacio</strong> o <strong>↑</strong>, click o toca la pantalla. Doble salto disponible. Esquiva las botellas, pilla los diamantes rosas.</p>
          <button id="startBtn">Jugar</button>
          <p class="controls-tip">Sólo cuenta tu mejor puntuación del evento</p>
        </div>
        <div class="game-overlay hidden" id="endOverlay">
          <h3>Game <em>Over</em></h3>
          <div class="big-score" id="finalScore">0</div>
          <p id="rankMsg">Guardando puntuación…</p>
          <button id="againBtn">Volver a intentar</button>
        </div>
      </div>
    </section>`;
}

function rankingSection(){
  return `
    <section class="ranking-section">
      <h2>Ranking <em>en vivo</em></h2>
      <p class="sub-h">Top 10 — mejor puntuación de cada jugador</p>
      <div class="ranking-list" id="rankingList">
        <div class="rank-empty">Cargando…</div>
      </div>
    </section>`;
}

function rulesView(){
  return `
    <section class="rules">
      <h3>Cómo funciona</h3>
      <ul>
        <li>Puedes jugar todas las veces que quieras durante el evento. Sólo se guarda tu mejor partida.</li>
        <li>Los premios se entregan el día del evento en el local, presentando DNI y el número de teléfono con el que jugaste.</li>
        <li>Si un ganador no aparece a recoger su premio durante el evento, pasa al siguiente del ranking.</li>
        <li>Tus datos se usan únicamente para contactarte si ganas y se borran al cierre del evento.</li>
        <li>El Shaona se reserva el derecho de anular puntuaciones sospechosas de manipulación.</li>
      </ul>
    </section>`;
}

function closedView(){
  return `
    <section class="closed-card">
      <div class="closed-inner">
        <div class="alert">Torneo cerrado</div>
        <h2>El próximo está al caer</h2>
        <p>El juego sólo está activo durante eventos especiales del Shaona. Síguenos en redes para saber cuándo arranca el siguiente torneo.</p>
        <a href="index.html" class="btn" style="display:inline-block;width:auto;padding:14px 36px;text-decoration:none">Ver agenda →</a>
      </div>
    </section>
    ${rankingSection()}`;
}

/* ====== Form handling ====== */
document.addEventListener('submit', e => {
  if (e.target.id !== 'playerForm') return;
  e.preventDefault();
  const name = document.getElementById('name').value.trim();
  const phoneRaw = document.getElementById('phone').value.trim();
  const phone = phoneRaw.replace(/[\s\-()]/g,'');
  const consent = document.getElementById('consent').checked;
  const err = document.getElementById('formError');
  err.textContent = '';
  if (name.length < 2) return err.textContent = 'Pon al menos 2 letras en el nombre.';
  if (!/^[+]?[0-9]{9,15}$/.test(phone)) return err.textContent = 'Teléfono no parece válido (9-15 dígitos).';
  if (!consent) return err.textContent = 'Necesitamos tu consentimiento para contactarte.';
  setPlayer({ name, phone });
  render();
});

/* ============================================================
   GAME — Pink Runner (endless runner clásico)
   ============================================================ */
function initGame(player){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hudScore');
  const startOverlay = document.getElementById('startOverlay');
  const endOverlay = document.getElementById('endOverlay');
  const startBtn = document.getElementById('startBtn');
  const againBtn = document.getElementById('againBtn');

  const W = 900, H = 320, GROUND = 260;

  const state = {
    running: false,
    speed: 5,
    distance: 0,
    diamonds: 0,
    score: 0,
    combo: 0,
    bestCombo: 0,
    lastGemT: -999,
    shake: 0,
    panther: { x:90, y:GROUND, vy:0, w:44, h:80, jumps:0 },
    obstacles: [],
    gems: [],
    particles: [],
    trail: [],
    bgStars: [],
    groundX: 0,
    t: 0,
    spawnTimer: 80,
    keyDown: false,
    sound: (localStorage.getItem('shaona_sound') !== '0')
  };

  // Generar estrellas / luces de fondo
  for (let i=0;i<40;i++){
    state.bgStars.push({
      x: Math.random()*W,
      y: 20 + Math.random()*180,
      r: Math.random()*1.6 + 0.4,
      tw: Math.random()*Math.PI*2,
      color: Math.random()<.3 ? 'pink' : 'cyan',
      speed: Math.random()*0.4 + 0.1
    });
  }

  function reset(){
    state.running = true;
    state.speed = 5;
    state.distance = 0;
    state.diamonds = 0;
    state.score = 0;
    state.combo = 0;
    state.bestCombo = 0;
    state.lastGemT = -999;
    state.shake = 0;
    state.panther = { x:90, y:GROUND, vy:0, w:44, h:80, jumps:0 };
    state.obstacles = [];
    state.gems = [];
    state.particles = [];
    state.trail = [];
    state.t = 0;
    state.spawnTimer = 80;
    startOverlay.classList.add('hidden');
    endOverlay.classList.add('hidden');
  }

  /* ---- Partículas ---- */
  function spawnParticles(x, y, color, count){
    for (let i=0;i<count;i++){
      const a = Math.random() * Math.PI * 2;
      const s = 1 + Math.random() * 4;
      state.particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s - 1,
        life: 1,
        decay: 0.02 + Math.random() * 0.02,
        r: 1 + Math.random() * 2.5,
        color
      });
    }
  }
  function updateParticles(){
    for (let i = state.particles.length - 1; i >= 0; i--){
      const p = state.particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.15;
      p.life -= p.decay;
      if (p.life <= 0) state.particles.splice(i, 1);
    }
  }
  function drawParticles(){
    for (const p of state.particles){
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* ---- Sonido (Web Audio, lo mínimo imprescindible) ---- */
  let AC = null;
  function ac(){
    if (!AC){
      try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
    }
    return AC;
  }
  function beep(freq, duration=0.08, type='sine', vol=0.08){
    if (!state.sound) return;
    const c = ac(); if (!c) return;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + duration);
    o.connect(g).connect(c.destination);
    o.start();
    o.stop(c.currentTime + duration);
  }
  function sfxJump(){ beep(520, 0.08, 'square', 0.05); }
  function sfxGem(combo){
    const base = 660 + Math.min(combo, 8) * 45;
    beep(base, 0.09, 'triangle', 0.08);
    setTimeout(() => beep(base * 1.5, 0.06, 'triangle', 0.05), 60);
  }
  function sfxDead(){
    beep(220, 0.14, 'sawtooth', 0.09);
    setTimeout(() => beep(120, 0.25, 'sawtooth', 0.08), 100);
  }

  function jump(){
    if (!state.running) return;
    if (state.panther.jumps < 2){
      state.panther.vy = state.panther.jumps === 0 ? -13 : -10.5;
      state.panther.jumps++;
      sfxJump();
      // pequeña ráfaga de partículas rosas bajo los pies
      spawnParticles(state.panther.x + state.panther.w/2, state.panther.y, 'rgba(255,0,102,0.9)', 6);
    }
  }

  function onKey(e){
    if (e.code === 'Space' || e.code === 'ArrowUp'){
      e.preventDefault();
      if (!state.keyDown) jump();
      state.keyDown = true;
    }
  }
  function onKeyUp(e){ if (e.code === 'Space' || e.code === 'ArrowUp') state.keyDown = false; }
  document.addEventListener('keydown', onKey);
  document.addEventListener('keyup', onKeyUp);
  canvas.addEventListener('mousedown', jump);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); jump(); }, { passive:false });

  startBtn.addEventListener('click', () => { reset(); requestAnimationFrame(loop); });
  againBtn.addEventListener('click', () => { reset(); requestAnimationFrame(loop); });

  // Sound toggle
  const soundToggle = document.getElementById('soundToggle');
  const syncSoundBtn = () => soundToggle.classList.toggle('muted', !state.sound);
  syncSoundBtn();
  soundToggle.addEventListener('click', e => {
    e.stopPropagation();
    state.sound = !state.sound;
    localStorage.setItem('shaona_sound', state.sound ? '1' : '0');
    syncSoundBtn();
    if (state.sound) beep(880, 0.05, 'sine', 0.05);
  });

  /* ====== Render ====== */
  function drawBg(){
    // sky
    const sky = ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,'#1a0510');
    sky.addColorStop(0.55,'#0a0008');
    sky.addColorStop(1,'#2a0014');
    ctx.fillStyle = sky;
    ctx.fillRect(0,0,W,H);

    // far city glow
    ctx.fillStyle = 'rgba(255,0,102,0.05)';
    ctx.fillRect(0, GROUND-80, W, 80);

    // stars / luces
    for (const s of state.bgStars){
      s.x -= s.speed * (state.running ? state.speed * 0.15 : 0.3);
      if (s.x < -4) s.x = W + 4;
      const a = 0.4 + Math.sin(state.t/22 + s.tw) * 0.4;
      ctx.fillStyle = s.color === 'pink' ? `rgba(255,0,170,${a})` : `rgba(0,224,255,${a*0.7})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fill();
    }

    // ground line
    ctx.strokeStyle = 'rgba(255,0,102,0.55)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, GROUND+18);
    ctx.lineTo(W, GROUND+18);
    ctx.stroke();

    // ground texture (perspective dashes)
    if (state.running) state.groundX = (state.groundX - state.speed) % 60;
    for (let i=-1;i<20;i++){
      const x = i*60 + state.groundX;
      ctx.strokeStyle = 'rgba(255,0,102,0.18)';
      ctx.beginPath();
      ctx.moveTo(x, GROUND+24);
      ctx.lineTo(x+34, GROUND+24);
      ctx.stroke();
    }
    // bottom area fill
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(0, GROUND+30, W, H-GROUND-30);
  }

  function drawPanther(){
    const p = state.panther;
    const isJumping = p.y < GROUND - 2;
    const cx = p.w / 2;       // eje central X relativo
    const altitude = GROUND - p.y;
    // Ciclo de carrera (sólo cuando toca suelo)
    const run = isJumping ? 0 : Math.sin(state.t / 3);
    const runFast = isJumping ? 0 : Math.sin(state.t / 3 + Math.PI);

    ctx.save();
    ctx.translate(p.x, p.y);

    // === SOMBRA en el suelo (se reduce al saltar) ===
    const sw = Math.max(18 - altitude * 0.06, 6);
    ctx.fillStyle = `rgba(0,0,0,${Math.max(0.45 - altitude * 0.003, 0.06)})`;
    ctx.beginPath();
    ctx.ellipse(cx, altitude + 2, sw, 3, 0, 0, Math.PI * 2);
    ctx.fill();

    // === COLA larga y curva, característica de la pantera ===
    const wag = Math.sin(state.t / 4) * 5;
    ctx.strokeStyle = '#ff0066';
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - 6, -28);
    ctx.bezierCurveTo(cx - 26, -28 + wag * 0.3, cx - 32, -58 + wag, cx - 14, -72 + wag * 0.5);
    ctx.stroke();
    // bola en la punta
    ctx.fillStyle = '#ff0066';
    ctx.beginPath();
    ctx.arc(cx - 14, -72 + wag * 0.5, 5, 0, Math.PI * 2);
    ctx.fill();

    // === PIERNAS bípedas (alternan al correr, se recogen al saltar) ===
    const lLegLift = isJumping ? 10 : Math.max(0, run * 6);
    const rLegLift = isJumping ? 10 : Math.max(0, runFast * 6);
    ctx.fillStyle = '#ff0066';
    // pierna izquierda
    ctx.fillRect(cx - 10, -22, 7, 22 - lLegLift);
    // pierna derecha
    ctx.fillRect(cx + 3, -22, 7, 22 - rLegLift);
    // pies (más oscuros)
    ctx.fillStyle = '#cc0044';
    ctx.beginPath();
    ctx.ellipse(cx - 6, -lLegLift, 7, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx + 6, -rLegLift, 7, 3, 0, 0, Math.PI * 2);
    ctx.fill();

    // === CUERPO/TORSO ===
    ctx.fillStyle = '#ff0066';
    ctx.beginPath();
    ctx.ellipse(cx, -36, 13, 18, 0, 0, Math.PI * 2);
    ctx.fill();

    // === CAMISETA del Shaona (negra con logo) ===
    ctx.fillStyle = '#0a0008';
    // cuerpo de la camiseta (trapecio)
    ctx.beginPath();
    ctx.moveTo(cx - 13, -44);
    ctx.lineTo(cx + 13, -44);
    ctx.lineTo(cx + 15, -22);
    ctx.lineTo(cx - 15, -22);
    ctx.closePath();
    ctx.fill();
    // cuello en V (deja ver un poco de rosa)
    ctx.fillStyle = '#ff0066';
    ctx.beginPath();
    ctx.moveTo(cx - 4, -44);
    ctx.lineTo(cx + 4, -44);
    ctx.lineTo(cx, -38);
    ctx.closePath();
    ctx.fill();
    // borde sutil del cuello
    ctx.strokeStyle = '#1a0010';
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.moveTo(cx - 4, -44);
    ctx.lineTo(cx, -38);
    ctx.lineTo(cx + 4, -44);
    ctx.stroke();
    // logo SHAONA en rosa
    ctx.fillStyle = '#ff0066';
    ctx.font = 'bold 6px Outfit, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('SHAONA', cx, -32);
    // puntito final (.) del logo
    ctx.fillStyle = '#00e0ff';
    ctx.fillRect(cx + 14, -30, 1.5, 1.5);

    // === BRAZOS (oscilan al correr / arriba al saltar) ===
    const armSwing = isJumping ? -1.1 : run * 0.55;
    ctx.fillStyle = '#ff0066';
    // brazo izquierdo
    ctx.save();
    ctx.translate(cx - 14, -42);
    ctx.rotate(-armSwing);
    ctx.fillRect(-3, 0, 6, 18);
    ctx.beginPath();
    ctx.arc(0, 20, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    // brazo derecho
    ctx.save();
    ctx.translate(cx + 14, -42);
    ctx.rotate(armSwing);
    ctx.fillRect(-3, 0, 6, 18);
    ctx.beginPath();
    ctx.arc(0, 20, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // === CABEZA (ovalada, ligeramente alargada) ===
    ctx.fillStyle = '#ff0066';
    ctx.beginPath();
    ctx.ellipse(cx + 1, -58, 14, 13, 0, 0, Math.PI * 2);
    ctx.fill();
    // hocico hacia delante
    ctx.beginPath();
    ctx.ellipse(cx + 10, -54, 7, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    // === OREJAS largas y puntiagudas ===
    ctx.fillStyle = '#ff0066';
    // oreja izquierda
    ctx.beginPath();
    ctx.moveTo(cx - 10, -65);
    ctx.lineTo(cx - 12, -80);
    ctx.lineTo(cx - 4, -68);
    ctx.closePath();
    ctx.fill();
    // oreja derecha
    ctx.beginPath();
    ctx.moveTo(cx + 5, -67);
    ctx.lineTo(cx + 10, -80);
    ctx.lineTo(cx + 13, -64);
    ctx.closePath();
    ctx.fill();
    // interior de las orejas
    ctx.fillStyle = '#cc0044';
    ctx.beginPath();
    ctx.moveTo(cx - 9, -68);
    ctx.lineTo(cx - 10, -76);
    ctx.lineTo(cx - 6, -69);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx + 7, -68);
    ctx.lineTo(cx + 9, -76);
    ctx.lineTo(cx + 11, -66);
    ctx.closePath();
    ctx.fill();

    // === NARIZ pequeña al final del hocico ===
    ctx.fillStyle = '#330011';
    ctx.beginPath();
    ctx.arc(cx + 15, -55, 2.5, 0, Math.PI * 2);
    ctx.fill();

    // === OJOS amarillos en almendra (estilo pantera) ===
    // blanco/amarillo claro
    ctx.fillStyle = '#fff4c2';
    ctx.beginPath();
    ctx.ellipse(cx - 1, -60, 3.6, 4.6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx + 7, -60, 3.6, 4.6, 0, 0, Math.PI * 2);
    ctx.fill();
    // pupila vertical (felina)
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(cx, -60, 1.2, 3.2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx + 8, -60, 1.2, 3.2, 0, 0, Math.PI * 2);
    ctx.fill();
    // brillo
    ctx.fillStyle = '#fff';
    ctx.fillRect(cx + 0.5, -62, 1, 1);
    ctx.fillRect(cx + 8.5, -62, 1, 1);

    // === BOCA (sonrisa pícara) ===
    ctx.strokeStyle = '#660020';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(cx + 12, -52, 2.5, 0, Math.PI);
    ctx.stroke();

    // === BIGOTES ===
    ctx.strokeStyle = 'rgba(0,0,0,0.45)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(cx + 10, -54); ctx.lineTo(cx + 20, -56);
    ctx.moveTo(cx + 10, -53); ctx.lineTo(cx + 20, -52);
    ctx.stroke();

    ctx.restore();
  }

  function drawObstacle(o){
    ctx.save();
    ctx.translate(o.x, GROUND);
    // bottle glass
    const g = ctx.createLinearGradient(-10,-50,10,0);
    g.addColorStop(0,'#0a3a1a');
    g.addColorStop(0.5,'#1f5a2f');
    g.addColorStop(1,'#0a2a14');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-10, 6);
    ctx.lineTo(-10, -30);
    ctx.lineTo(-5, -38);
    ctx.lineTo(-5, -52);
    ctx.lineTo(5, -52);
    ctx.lineTo(5, -38);
    ctx.lineTo(10, -30);
    ctx.lineTo(10, 6);
    ctx.closePath();
    ctx.fill();
    // shine
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fillRect(-7, -28, 2, 26);
    // gold foil top
    ctx.fillStyle = '#d4af37';
    ctx.fillRect(-6, -56, 12, 6);
    // label
    ctx.fillStyle = '#ff0066';
    ctx.fillRect(-10, -22, 20, 12);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 8px Outfit, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('S', 0, -13);
    ctx.restore();
  }

  function drawGem(g){
    ctx.save();
    ctx.translate(g.x, g.y);
    const pulse = 1 + Math.sin(state.t/8 + g.x*0.01)*0.12;
    ctx.scale(pulse, pulse);
    // glow
    const glow = ctx.createRadialGradient(0,0,0,0,0,22);
    glow.addColorStop(0,'rgba(255,0,170,0.55)');
    glow.addColorStop(1,'rgba(255,0,170,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0,0,22,0,Math.PI*2);
    ctx.fill();
    // diamond shape
    const r = 11;
    ctx.fillStyle = '#ff66cc';
    ctx.beginPath();
    ctx.moveTo(0,-r);
    ctx.lineTo(r,0);
    ctx.lineTo(0,r);
    ctx.lineTo(-r,0);
    ctx.closePath();
    ctx.fill();
    // facets
    ctx.fillStyle = '#ffb3e0';
    ctx.beginPath();
    ctx.moveTo(0,-r);
    ctx.lineTo(r-3,-1);
    ctx.lineTo(0,1);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#ff99d6';
    ctx.beginPath();
    ctx.moveTo(0,r);
    ctx.lineTo(-r+3,1);
    ctx.lineTo(0,-1);
    ctx.closePath();
    ctx.fill();
    // shine
    ctx.fillStyle = '#fff';
    ctx.fillRect(-3, -8, 2, 4);
    ctx.restore();
  }

  function spawn(){
    state.spawnTimer--;
    if (state.spawnTimer <= 0){
      const r = Math.random();
      if (r < 0.7){
        state.obstacles.push({ x: W + 30, w: 20, h: 58 });
      } else if (r < 0.92){
        state.gems.push({ x: W + 30, y: GROUND - 60 - Math.random()*70, collected: false });
      } else {
        // double obstacle (más difícil)
        state.obstacles.push({ x: W + 30, w: 20, h: 58 });
        state.obstacles.push({ x: W + 90, w: 20, h: 58 });
      }
      state.spawnTimer = Math.max(60 - state.speed*3, 28) + Math.random()*30;
    }
  }

  function update(){
    state.t++;
    state.distance += state.speed;
    state.speed = Math.min(5 + state.distance/2500, 13);

    // physics
    const p = state.panther;
    p.vy += 0.72;
    p.y += p.vy;
    if (p.y >= GROUND){
      p.y = GROUND;
      p.vy = 0;
      p.jumps = 0;
    }

    // move + cleanup
    state.obstacles = state.obstacles.filter(o => { o.x -= state.speed; return o.x > -40; });
    state.gems = state.gems.filter(g => { g.x -= state.speed; return g.x > -30 && !g.collected; });

    spawn();

    // collisions — caja ajustada al cuerpo (bípedo, ~70px alto / ~26 ancho)
    const px = p.x + p.w/2 - 13, py = p.y - 72, pw = 26, ph = 72;
    for (const o of state.obstacles){
      const ox = o.x - 10, oy = GROUND - o.h, ow = 20, oh = o.h;
      if (px < ox + ow && px + pw > ox && py < oy + oh && py + ph > oy){
        return gameOver();
      }
    }
    // recogida de diamantes — centrada en el pecho (camiseta)
    for (const g of state.gems){
      const dx = (p.x + p.w/2) - g.x;
      const dy = (p.y - 36) - g.y;
      if (Math.sqrt(dx*dx + dy*dy) < 32){
        g.collected = true;
        state.diamonds++;
        // combo: si otro gem hace poco, sube; si no, resetea
        if (state.t - state.lastGemT < 90) state.combo++;
        else state.combo = 1;
        state.lastGemT = state.t;
        if (state.combo > state.bestCombo) state.bestCombo = state.combo;
        // burst de partículas rosas
        spawnParticles(g.x, g.y, '#ff66cc', 14);
        spawnParticles(g.x, g.y, '#ff99dd', 6);
        sfxGem(state.combo);
      }
    }

    updateParticles();
    // trail al saltar
    if (state.panther.y < GROUND - 4){
      state.trail.unshift({ x: state.panther.x + state.panther.w/2, y: state.panther.y - 30, life: 1 });
      if (state.trail.length > 12) state.trail.pop();
    }
    for (let i = state.trail.length - 1; i >= 0; i--){
      state.trail[i].life -= 0.08;
      if (state.trail[i].life <= 0) state.trail.splice(i, 1);
    }

    // Score: distancia + gems * (50 + bonus por combo)
    const gemBonus = state.combo > 1 ? state.combo * 10 : 0;
    state.score = Math.floor(state.distance / 8) + state.diamonds * 50 + state.bestCombo * gemBonus;
    hud.textContent = state.score;

    // decae shake
    if (state.shake > 0) state.shake *= 0.85;
  }

  function loop(){
    // seguimos animando mientras haya shake residual o partículas
    if (!state.running && state.particles.length === 0 && state.shake < 0.4) return;
    if (state.running) update();
    else { state.shake *= 0.9; updateParticles(); state.t++; }
    ctx.save();
    // Screen shake para hits fuertes
    if (state.shake > 0.4){
      const dx = (Math.random() - 0.5) * state.shake;
      const dy = (Math.random() - 0.5) * state.shake;
      ctx.translate(dx, dy);
    }
    drawBg();
    // trail (líneas rosas suaves siguiendo al saltador)
    for (let i = 0; i < state.trail.length - 1; i++){
      const t = state.trail[i], n = state.trail[i+1];
      ctx.globalAlpha = t.life * 0.35;
      ctx.strokeStyle = '#ff0066';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(t.x, t.y);
      ctx.lineTo(n.x, n.y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    state.gems.forEach(drawGem);
    state.obstacles.forEach(drawObstacle);
    drawPanther();
    drawParticles();
    // combo indicator flotante
    if (state.running && state.combo >= 2 && state.t - state.lastGemT < 40){
      const age = state.t - state.lastGemT;
      ctx.globalAlpha = Math.max(0, 1 - age / 40);
      ctx.fillStyle = '#ff66cc';
      ctx.font = 'bold 26px Cormorant Garamond, serif';
      ctx.textAlign = 'center';
      ctx.fillText('x' + state.combo, W/2, 90 - age);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    requestAnimationFrame(loop);
  }

  function gameOver(){
    state.running = false;
    state.shake = 16;
    sfxDead();
    // explosión de partículas en la posición del jugador
    spawnParticles(state.panther.x + state.panther.w/2, state.panther.y - 30, '#ff0066', 26);
    spawnParticles(state.panther.x + state.panther.w/2, state.panther.y - 30, '#ff66cc', 18);
    document.getElementById('finalScore').textContent = state.score;
    endOverlay.classList.remove('hidden');
    const rankMsg = document.getElementById('rankMsg');
    // Stats de la partida
    const dia = state.diamonds;
    const bc = state.bestCombo;
    const statsLine = `<span style="display:inline-flex;gap:14px;justify-content:center;font-size:.85rem;color:var(--muted);margin-top:8px">
      <span>💎 <strong style="color:var(--text)">${dia}</strong> diamantes</span>
      ${bc > 1 ? `<span>🔥 combo x<strong style="color:var(--pink)">${bc}</strong></span>` : ''}
    </span>`;
    submitScore(player, state.score).then(res => {
      if (res.ok){
        if (res.position && res.position <= 3){
          rankMsg.innerHTML = `¡Estás en el <strong style="color:var(--pink)">puesto #${res.position}</strong> del ranking!<br>${statsLine}`;
        } else if (res.position){
          rankMsg.innerHTML = `Vas en el puesto <strong style="color:var(--pink)">#${res.position}</strong>. Sigue intentando.<br>${statsLine}`;
        } else {
          rankMsg.innerHTML = `Puntuación guardada.<br>${statsLine}`;
        }
      } else {
        rankMsg.textContent = res.message || 'No se pudo guardar tu puntuación.';
      }
      loadRanking();
    });
  }

  // pinta el frame inicial para que se vea algo bajo el overlay
  drawBg();
  drawPanther();
}

/* ====== Supabase ====== */
async function submitScore(player, score){
  if (!supa) return { ok:false, message:'Conexión con el servidor no configurada.' };
  try {
    const { error } = await supa.from('tournament_scores').insert({
      event_id: cfg.eventId,
      name: player.name,
      phone: player.phone,
      score: score
    });
    if (error) throw error;
    const { data } = await supa.from('tournament_scores')
      .select('phone, score')
      .eq('event_id', cfg.eventId)
      .order('score', { ascending:false })
      .limit(500);
    const best = new Map();
    for (const r of data || []){
      if (!best.has(r.phone) || r.score > best.get(r.phone)) best.set(r.phone, r.score);
    }
    const ordered = [...best.entries()].sort((a,b)=>b[1]-a[1]);
    const pos = ordered.findIndex(([phone]) => phone === player.phone) + 1;
    return { ok:true, position: pos || null };
  } catch (e){
    console.error(e);
    return { ok:false, message:'Error al guardar la puntuación.' };
  }
}

async function loadRanking(){
  const list = document.getElementById('rankingList');
  if (!list) return;
  if (!supa){
    list.innerHTML = '<div class="rank-empty">Ranking no disponible (servidor no configurado).</div>';
    return;
  }
  try {
    const { data, error } = await supa.from('tournament_scores')
      .select('name, phone, score')
      .eq('event_id', cfg.eventId)
      .order('score', { ascending:false })
      .limit(500);
    if (error) throw error;
    const best = new Map();
    for (const r of data || []){
      const existing = best.get(r.phone);
      if (!existing || r.score > existing.score) best.set(r.phone, r);
    }
    const top = [...best.values()].sort((a,b)=>b.score - a.score).slice(0, 10);
    if (!top.length){
      list.innerHTML = '<div class="rank-empty">Aún no hay partidas. ¡Sé el primero!</div>';
      return;
    }
    const me = getPlayer();
    list.innerHTML = top.map((r,i) => {
      const isMe = me && me.phone === r.phone;
      const cls = ['','top1','top2','top3'][i+1 <=3 ? i+1 : 0];
      return `<div class="rank-row ${cls} ${isMe?'is-me':''}">
        <div class="pos">${i+1}</div>
        <div class="name">${escapeHtml(r.name)}${isMe?' · tú':''}</div>
        <div class="score">${r.score}</div>
      </div>`;
    }).join('');
  } catch (e){
    list.innerHTML = '<div class="rank-empty">No se pudo cargar el ranking ahora mismo.</div>';
  }
}

/* ====== utils ====== */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

setInterval(loadRanking, 30000);
render();
</script>
